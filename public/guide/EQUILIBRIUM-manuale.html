    P({fr:`La valeur 1–10 ne mesure pas une quantité absolue : elle dit <strong>de combien la charge monte par rapport au niveau ambiant</strong> du préclear à cet instant. Ambiant = 0 · le double de l'ambiant ≈ 5 · le triple ou plus = 10. C'est ce qui permet à l'échelle de fonctionner pour tout le monde, sur n'importe quel casque — un chiffre absolu, lui, saturerait à 10 pour certains et resterait à 1 pour d'autres.`,
        it:`Il valore 1–10 non misura una quantità assoluta: dice <strong>di quanto la carica sale rispetto al livello ambiente</strong> del preclear in quell'istante. Ambiente = 0 · il doppio dell'ambiente ≈ 5 · il triplo o più = 10. È questo che permette alla scala di funzionare per tutti, su qualsiasi casco — un numero assoluto saturerebbe a 10 per alcuni e resterebbe a 1 per altri.`,
        en:`The 1–10 value does not measure an absolute quantity: it says <strong>how much the charge rises above the preclear's ambient level</strong> at that moment. Ambient = 0 · twice ambient ≈ 5 · three times or more = 10. That is what lets the scale work for everyone, on any headset — an absolute figure would saturate at 10 for some and stay at 1 for others.`}),
    NOTE("info",UI.L_note,{fr:`Le ×2 est la <strong>règle</strong> de Ron, pas une mesure d'ohms. Le total de la séance additionne les valeurs des items traités et affiche aussi leur double.|À chaque VALIDER, une ligne technique est écrite au journal (ambiant, pic, rapport, valeur) : ce sont les chiffres à communiquer si l'échelle demande un réglage.`,
        it:`Il ×2 è la <strong>regola</strong> di Ron, non una misura in ohm. Il totale della seduta somma i valori degli item trattati e mostra anche il loro doppio.|Ad ogni VALIDA una riga tecnica viene scritta nel journal (ambiente, picco, rapporto, valore): sono i numeri da comunicare se la scala richiede una taratura.`,
        en:`The ×2 is Ron's <strong>rule</strong>, not an ohms measurement. The session total sums the values of the items handled and also shows their double.|On each VALIDATE a technical line is written to the journal (ambient, peak, ratio, value): these are the numbers to share if the scale needs tuning.`}),
    SHOT("mirror-total.png",{fr:"Le total de la séance",it:"Il totale della seduta",en:"The session total"},1)]},

/* ───────────────────────── TONE SCALE ───────────────────────── */
{ id:"m-tone", grp:"dial", t:{fr:"TONE SCALE — monter au ton 40 (Ron)",it:"TONE SCALE — salire al tono 40 (Ron)",en:"TONE SCALE — up to tone 40 (Ron)"},
  role:[
    P({fr:`La quatrième vue, à côté de CONTACT, NULL et MIRROR. Un cadran de <strong>−40 à +40</strong>, le zéro au centre : moins de résistance = ton plus haut. <strong>Deux commandes, deux temps</strong> : on fait localiser une résistance, puis on la fait monter au ton 40 — la même cible pour toutes les résistances.`,
        it:`La quarta vista, accanto a CONTACT, NULL e MIRROR. Un quadrante da <strong>−40 a +40</strong>, lo zero al centro: meno resistenza = tono più alto. <strong>Due comandi, due tempi</strong>: si fa localizzare una resistenza, poi la si fa salire al tono 40 — la stessa meta per tutte le resistenze.`,
        en:`The fourth view, beside CONTACT, NULL and MIRROR. A dial from <strong>−40 to +40</strong>, zero at the centre: less resistance = higher tone. <strong>Two commands, two beats</strong>: you have a resistance located, then you take it to tone 40 — the same target for every resistance.`})],
  on:[
    P({fr:`Choisissez <span class="tag">TONE SCALE</span> dans le sélecteur. Les <strong>deux temps</strong> s'affichent en piste au-dessus du champ — <em>item · ton 40</em> — et chaque temps n'offre que son geste. <em>(Jusqu'à la 2.0.115 il y en avait quatre : on assessait le signe et l'ampleur. Ce n'est pas la procédure — les commandes de Ron sont deux.)</em>`,
        it:`Scegli <span class="tag">TONE SCALE</span> nel selettore. I <strong>due tempi</strong> compaiono come pista sopra il campo — <em>item · tono 40</em> — e ogni tempo offre solo il suo gesto. <em>(Fino alla 2.0.115 erano quattro: si assessavano segno e ampiezza. Non è la procedura — i comandi di Ron sono due.)</em>`,
        en:`Pick <span class="tag">TONE SCALE</span> in the selector. The <strong>two beats</strong> appear as a track above the field — <em>item · tone 40</em> — and each beat offers only its own gesture. <em>(Up to 2.0.115 there were four: sign and magnitude were assessed. That is not the procedure — Ron's commands are two.)</em>`})],
  off:[ P({fr:`Revenez à une autre vue. Un cycle TONE non validé reste en mémoire ; <span class="tag">ANNULER</span> le ferme sans le valider.`,
        it:`Torna a un'altra vista. Un ciclo TONE non validato resta in memoria; <span class="tag">ANNULLA</span> lo chiude senza validarlo.`,
        en:`Go back to another view. An unvalidated TONE cycle stays in memory; <span class="tag">CANCEL</span> closes it without validating.`})],
  in:[
    H4({fr:"Les deux commandes de Ron",it:"I due comandi di Ron",en:"Ron's two commands"}),
    P({fr:`Elles sont écrites à l'écran, mot pour mot : il n'y a rien à retenir, il suffit de les lire au préclear.`,
        it:`Sono scritte a schermo, parola per parola: non c'è nulla da ricordare, basta leggerle al preclear.`,
        en:`They are written on screen, word for word: nothing to memorise, you just read them to the preclear.`}),
    UL({fr:[`<strong>1.</strong> <em>« Locate resistance on your case that can now be run. »</em> — écrivez ou faites dire la résistance, puis pressez.`,
            `<strong>2.</strong> <em>« Raise this to tone forty on the tone scale. »</em> — <strong>redonnée autant de fois qu'il le faut</strong>. Le bouton porte la commande elle-même, <span class="tag">MÈNE-LE AU TON 40</span>, avec un mégaphone : c'est une chose à <em>dire</em>. Chaque pression compte une passe ; le nombre reste affiché et part dans le journal.`,
            `Le cycle se ferme sur <span class="tag">TON QUARANTE ATTEINT</span> : plus de réaction, sérénité de l'être. <strong>C'est vous qui validez</strong>, jamais l'app.`],
        it:[`<strong>1.</strong> <em>« Localizza sul tuo caso una resistenza che possa essere corsa adesso. »</em> — scrivi o fai dire la resistenza, poi premi.`,
            `<strong>2.</strong> <em>« Porta questo a tono quaranta sulla scala del tono. »</em> — <strong>ridato quante volte serve</strong>. Il bottone porta il comando stesso, <span class="tag">PORTALO A TONO 40</span>, con un megafono: è una cosa da <em>dire</em>. Ogni pressione conta una passata; il numero resta a schermo e va nel journal.`,
            `Il ciclo si chiude su <span class="tag">TONO QUARANTA RAGGIUNTO</span>: nessuna reazione, serenità dell'essere. <strong>Sei tu a validare</strong>, mai l'app.`],
        en:[`<strong>1.</strong> <em>"Locate resistance on your case that can now be run."</em> — type or have the resistance said, then press.`,
            `<strong>2.</strong> <em>"Raise this to tone forty on the tone scale."</em> — <strong>given again as many times as needed</strong>. The button carries the command itself, <span class="tag">RAISE IT TO TONE 40</span>, with a megaphone: it is something to <em>say</em>. Each press counts a pass; the number stays on screen and goes to the journal.`,
            `The cycle closes on <span class="tag">TONE FORTY REACHED</span>: no reaction, serenity of beingness. <strong>You validate</strong>, never the app.`]}),
    H4({fr:"La colonne des niveaux",it:"La colonna dei livelli",en:"The levels column"}),
    P({fr:`À droite du cadran, une colonne verticale porte l'échelle. Le curseur donne la valeur et le <strong>nom du niveau</strong> — Colère, Chagrin, Apathie… — et un trait ambre relie le ton de départ au ton actuel. Les valeurs écrites sont −40, −30, −20, −10, 0, 2, 3, 4, 6, 9, 20, 30, 40 ; les autres n'apparaissent qu'au curseur. Les noms sont <strong>traduits dans les cinq langues</strong> et écrits assez gros pour se lire de loin — sur deux lignes quand il le faut.<br><strong>Le ton de départ est celui du CYCLE</strong>, pas une lecture absolue du mètre : à la localisation on fixe « ici tu es à −12 » — proposé par la mesure s'il y a un mètre, dit par l'auditeur sinon — et à partir de là on mesure la MONTÉE. La pente reste celle de Ron : toute l'étendue de la grandeur vaut 80 divisions. Avec le MUSE en plus, une marque pointillée « EEG » montre la même montée lue sur l'activité cérébrale : si les deux montent ensemble, c'est confirmé par deux instruments indépendants.<br><strong>L'échelle n'est pas linéaire</strong>, et c'est voulu : entre 0 et 9 il y a quarante niveaux, entre 9 et 40 il y en a trois. Chaque intervalle entre deux valeurs écrites occupe la même hauteur, donc la bande où le préclair passe son temps prend presque la moitié de la colonne au lieu d'un dixième. On perd la proportion, on garde le sens de la marche — le « combien » reste à l'aiguille.`,
        it:`A destra del quadrante, una colonna verticale porta la scala. Il cursore dà il valore e il <strong>nome del livello</strong> — Collera, Dolore, Apatia… — e un tratto ambra collega il tono di partenza al tono attuale. I valori scritti sono −40, −30, −20, −10, 0, 2, 3, 4, 6, 9, 20, 30, 40; gli altri compaiono solo al cursore. I nomi sono <strong>tradotti nelle cinque lingue</strong> e scritti abbastanza grandi da leggersi da lontano — su due righe quando serve.<br><strong>Il tono di partenza è quello del CICLO</strong>, non una lettura assoluta del meter: alla localizzazione si fissa « qui sei a −12 » — proposto dalla misura se c'è un meter, detto dall'auditor altrimenti — e da lì si misura la SALITA. La pendenza resta quella di Ron: l'intera escursione della grandezza vale 80 divisioni. Col MUSE in più, una marca tratteggiata « EEG » mostra la stessa salita letta sull'attività cerebrale: se salgono insieme, è confermata da due strumenti indipendenti.<br><strong>La scala non è lineare</strong>, ed è voluto: fra 0 e 9 ci sono quaranta livelli, fra 9 e 40 tre. Ogni intervallo fra due valori scritti occupa la stessa altezza, così la banda dove il preclear passa il tempo prende quasi metà colonna invece di un decimo. Si perde la proporzione, si tiene il verso della marcia — il « quanto » resta dell'ago.`,
        en:`To the right of the dial, a vertical column carries the scale. The cursor gives the value and the <strong>level name</strong> — Anger, Grief, Apathy… — and an amber segment links the starting tone to the current one. The written values are −40, −30, −20, −10, 0, 2, 3, 4, 6, 9, 20, 30, 40; the others appear only at the cursor. The names are <strong>translated into all five languages</strong> and set large enough to read at a distance — on two lines where needed.<br><strong>The starting tone belongs to the CYCLE</strong>, not to an absolute meter reading: at the locate you fix "here you are at −12" — proposed by the measure if a meter is present, said by the auditor otherwise — and from there the RISE is measured. The slope stays Ron's: the whole span of the quantity is worth 80 divisions. With the MUSE too, a dashed "EEG" mark shows the same rise read on brain activity: if both rise together, it is confirmed by two independent instruments.<br><strong>The scale is not linear</strong>, on purpose: between 0 and 9 there are forty levels, between 9 and 40 there are three. Each interval between two written values takes the same height, so the band where the preclear spends their time gets almost half the column instead of a tenth. Proportion is lost, direction of travel is kept — the "how much" stays with the needle.`}),
    NOTE("warn",UI.L_note,{fr:`Sans le THETA-METER, l'échelle passe par le TA reconstruit et le cadran écrit un <strong>≈</strong> : les valeurs sont <strong>relatives</strong>, pas des ohms.`,
        it:`Senza THETA-METER la scala passa dal TA ricostruito e il quadrante scrive un <strong>≈</strong>: i valori sono <strong>relativi</strong>, non ohm.`,
        en:`Without the THETA-METER the scale goes through the reconstructed TA and the dial writes a <strong>≈</strong>: values are <strong>relative</strong>, not ohms.`})]},

/* ───────────────────────── ASSESSMENT ───────────────────────── */
{ id:"m-assessment", grp:"dial", t:{fr:"ASSESSMENT & R&I — la liste, et ce qu'elle indique",it:"ASSESSMENT & R&I — la lista, e cosa indica",en:"ASSESSMENT & R&I — the list, and what it indicates"},
  role:[
    P({fr:`Pour passer une liste d'items sans ouvrir un cycle complet à chaque fois. Vous énoncez les items à la suite ; l'app inscrit chacun avec sa lecture.`,
        it:`Per passare una lista di item senza aprire ogni volta un ciclo completo. Enunci gli item di seguito; l'app iscrive ognuno con la sua lettura.`,
        en:`To run through a list of items without opening a full cycle each time. You say the items one after another; the app records each with its read.`}),
],
  on:[ P({fr:`Pressez le bouton <span class="tag">ASSESSMENT</span> (sous le sélecteur de vue). Il devient vert : le mode écoute. Énoncez vos items.`,
        it:`Premi il pulsante <span class="tag">ASSESSMENT</span> (sotto il selettore di vista). Diventa verde: il modo ascolta. Enuncia i tuoi item.`,
        en:`Press the <span class="tag">ASSESSMENT</span> button (below the view selector). It turns green: the mode is listening. Say your items.`}),
    SHOT("assessment-reads.png",{fr:"Le module : les items, leur READ, et l'indication au PC",it:"Il modulo: gli item, il loro READ, e l'indicazione al PC",en:"The module: the items, their READ, and the indication to the PC"})],
  off:[
    UL({fr:[`Re-pressez le bouton : le cycle se termine. Les mots restent sous l'arc <strong>5 secondes</strong> puis s'effacent.`,
            `Presser encore = <strong>nouveau</strong> cycle (les mots précédents disparaissent de sous l'arc, mais restent dans le module).`,
            `Pour masquer le module entier : décochez <strong>ASSESSMENT</strong> dans CONFIG.`],
        it:[`Ripremi il pulsante: il ciclo finisce. Le parole restano sotto l'arco <strong>5 secondi</strong> poi spariscono.`,
            `Premere ancora = <strong>nuovo</strong> ciclo (le parole precedenti spariscono da sotto l'arco, ma restano nel modulo).`,
            `Per nascondere l'intero modulo: togli la spunta a <strong>ASSESSMENT</strong> in CONFIG.`],
        en:[`Press again: the cycle ends. The words stay under the arc for <strong>5 seconds</strong> then fade.`,
            `Press once more = a <strong>new</strong> cycle (previous words leave the area under the arc but stay in the module).`,
            `To hide the whole module: uncheck <strong>ASSESSMENT</strong> in CONFIG.`]})],
  in:[
    P({fr:`Chaque item reçoit son <strong>READ</strong>, suivi de l'écart : <strong>−ms</strong> si la réaction est arrivée avant la fin du mot, <strong>+ms</strong> si elle est arrivée après. Ces écarts sont petits — c'est l'<strong>instant read</strong>, à la fin exacte du mot. Une réaction qui arrive une seconde plus tard est <strong>latente</strong> : elle n'est pas attribuée à l'item, et c'est la règle.`,
        it:`Ogni item riceve il suo <strong>READ</strong>, seguito dallo scarto: <strong>−ms</strong> se la reazione è arrivata prima della fine della parola, <strong>+ms</strong> se dopo. Sono scarti piccoli — è l'<strong>instant read</strong>, alla fine esatta della parola. Una reazione che arriva un secondo dopo è <strong>latente</strong>: non viene attribuita all'item, ed è la regola.`,
        en:`Each item gets its <strong>READ</strong>, followed by the offset: <strong>−ms</strong> if the reaction came before the end of the word, <strong>+ms</strong> if after. These offsets are small — this is the <strong>instant read</strong>, at the exact end of the word. A reaction arriving a second later is <strong>latent</strong>: it is not attributed to the item, and that is the rule.`}),
    NOTE("ok",UI.L_ok,{fr:`<strong>Deux garanties, sur lesquelles vous pouvez compter.</strong> Un READ n'apparaît que si la réaction a été <strong>montrée à l'écran</strong> — rien ne s'inscrit que vous n'ayez pu voir. Et un item ne prend jamais la lecture d'un autre : chaque mot ne reçoit que ce qui s'est passé à SA fin.`,
        it:`<strong>Due garanzie, su cui puoi contare.</strong> Un READ appare solo se la reazione è stata <strong>mostrata sullo schermo</strong> — non si scrive nulla che tu non abbia potuto vedere. E un item non prende mai la lettura di un altro: ogni parola riceve solo ciò che è successo alla SUA fine.`,
        en:`<strong>Two guarantees you can rely on.</strong> A READ appears only if the reaction was <strong>shown on screen</strong> — nothing is recorded that you could not have seen. And an item never takes another's read: each word gets only what happened at ITS end.`}),
    P({fr:`Si l'aiguille ne change pas → l'item est <span class="tag en">NULL</span>. Les mots restent dans le module toute la séance (le plus récent en haut) et partent au rapport. Une ligne est aussi écrite au journal pour chacun.`,
        it:`Se l'ago non cambia → l'item è <span class="tag en">NULL</span>. Le parole restano nel modulo per tutta la seduta (la più recente in alto) e finiscono nel rapporto. Una riga viene scritta nel journal per ognuna.`,
        en:`If the needle does not change → the item is <span class="tag en">NULL</span>. Words stay in the module for the whole session (most recent on top) and go to the report. A journal line is written for each one.`}),
    NOTE("warn",UI.L_warn,{fr:`Le mode capte ce que la reconnaissance vocale transcrit. Les interjections courantes (« ok », « bien ») sont écartées, mais si une parole n'est pas transcrite, elle ne peut pas être inscrite — parlez clairement.`,
        it:`Il modo cattura ciò che il riconoscimento vocale trascrive. Le interiezioni comuni (« ok », « bene ») sono scartate, ma se una parola non viene trascritta non può essere iscritta — parla chiaramente.`,
        en:`The mode captures what speech recognition transcribes. Common fillers ("ok", "right") are discarded, but a word that isn't transcribed cannot be recorded — speak clearly.`}),
    H4({fr:"R&I — la réaction indique-t-elle au PC ?",it:"R&I — la reazione indica al PC?",en:"R&I — does the read indicate to the PC?"}),
    P({fr:`Sous chaque item assessé, une question : <strong>INDIQUE AU PC ?</strong> avec <span class="tag">Oui</span> / <span class="tag">Non</span>. Vous indiquez la lecture au préclear, il vous dit si elle lui indique, vous cliquez. Un clic, sur la ligne, sans quitter la liste — et vous pouvez valider trois items plus tard, ou changer d'avis.`,
        it:`Sotto ogni item assessato, una domanda: <strong>INDICA AL PC?</strong> con <span class="tag">Sì</span> / <span class="tag">No</span>. Indichi la lettura al preclear, lui ti dice se gli indica, tu clicchi. Un clic, sulla riga, senza lasciare la lista — e puoi validare anche tre item dopo, o cambiare idea.`,
        en:`Under each assessed item, a question: <strong>INDICATES TO PC?</strong> with <span class="tag">Yes</span> / <span class="tag">No</span>. You indicate the read to the preclear, they tell you whether it indicates, you click. One click, on the row, without leaving the list — and you can validate three items later, or change your mind.`}),
    NOTE("info",UI.L_info,{fr:`<strong>Pourquoi cela compte.</strong> Sur 89 items passés avec les deux instruments, le MUSE et le METER ont lu le <strong>même item une seule fois</strong>. Aucun des deux ne peut donc servir de juge à l'autre. Le préclear, lui, sait si un item l'a remué : c'est le seul critère extérieur aux deux aiguilles.`,
        it:`<strong>Perché conta.</strong> Su 89 item passati con entrambi gli strumenti, MUSE e METER hanno letto lo <strong>stesso item una volta sola</strong>. Nessuno dei due può quindi fare da giudice all'altro. Il preclear invece sa se un item lo ha smosso: è il solo criterio esterno ai due aghi.`,
        en:`<strong>Why it matters.</strong> Across 89 items run with both instruments, the MUSE and the METER read the <strong>same item once</strong>. Neither can therefore judge the other. The preclear does know whether an item stirred them: that is the only criterion outside the two needles.`}),
    P({fr:`En bas du module, le compte : combien de fois la lecture de <strong>chaque</strong> aiguille a indiqué. Le dénominateur ne compte que les lignes où cette aiguille avait lu quelque chose — une aiguille qui se tait ne se trompe pas.`,
        it:`In fondo al modulo, il conto: quante volte la lettura di <strong>ciascun</strong> ago ha indicato. Il denominatore conta solo le righe in cui quell'ago aveva letto qualcosa — un ago che tace non sbaglia.`,
        en:`At the foot of the module, the tally: how often <strong>each</strong> needle's read indicated. The denominator counts only rows where that needle read something — a silent needle is never wrong.`}),

    H4({fr:"Vue MANUEL — les items trouvés autrement",it:"Vista MANUALE — gli item trovati altrimenti",en:"MANUAL view — items found otherwise"}),
    P({fr:`Tous les items ne viennent pas d'un assessment. Le préclear en dit un et l'aiguille réagit ; une question d'audition en fait sortir un ; ou il ne fait rien réagir mais il vous indique quand même. La deuxième vue du module, <span class="tag">R&amp;I · Manuel</span>, est faite pour ceux-là : un champ pour <strong>écrire l'item</strong>, et les mêmes deux boutons pour le valider.`,
        it:`Non tutti gli item vengono da un assessment. Il preclear ne dice uno e l'ago reagisce; una domanda di auditing ne fa uscire uno; oppure non fa reagire niente ma ti indica lo stesso. La seconda vista del modulo, <span class="tag">R&amp;I · Manuale</span>, è fatta per quelli: un campo per <strong>scrivere l'item</strong>, e gli stessi due pulsanti per validarlo.`,
        en:`Not every item comes from an assessment. The preclear says one and the needle reacts; an auditing question brings one out; or nothing reacts but it indicates to them anyway. The module's second view, <span class="tag">R&amp;I · Manual</span>, is for those: a field to <strong>write the item</strong>, and the same two buttons to validate it.`}),
    NOTE("ok",UI.L_ok,{fr:`<strong>L'app vous propose la lecture.</strong> Si le mot que vous tapez a déjà été <strong>dit</strong> pendant la séance, elle retrouve la dernière phrase qui le contient et propose <em>l'instant</em> et <em>la lecture d'alors</em> — « dit à 44s · aucune lecture », avec la phrase entière. Cliquez la proposition : la ligne est datée à ce moment-là, pas à maintenant. C'est tout l'intérêt — un item écrit à la main et daté de l'instant où vous l'écrivez se verrait attribuer une aiguille qui ne réagissait pas à lui.`,
        it:`<strong>L'app ti propone la lettura.</strong> Se la parola che scrivi è già stata <strong>detta</strong> in seduta, ritrova l'ultima frase che la contiene e propone <em>l'istante</em> e <em>la lettura di allora</em> — « detto a 44s · nessuna lettura », con la frase intera. Clicca la proposta: la riga è datata a quel momento, non ad adesso. È tutto il punto — un item scritto a mano e datato all'istante in cui lo scrivi si porterebbe dietro un ago che non stava reagendo a lui.`,
        en:`<strong>The app proposes the read.</strong> If the word you type was already <strong>said</strong> during the session, it finds the last phrase containing it and proposes <em>the moment</em> and <em>the read of then</em> — "said at 44s · no read", with the whole phrase. Click the proposal: the row is dated to that moment, not to now. That is the whole point — an item typed by hand and dated when you type it would be given a needle that was not reacting to it.`}),
    P({fr:`Chaque ligne porte les deux lectures côte à côte : <strong>M</strong> pour le MUSE, <strong>T</strong> pour le METER, et <strong>—</strong> quand l'un n'a rien vu. Cette absence est une donnée, pas un vide.`,
        it:`Ogni riga porta le due letture affiancate: <strong>M</strong> per il MUSE, <strong>T</strong> per il METER, e <strong>—</strong> quando uno non ha visto niente. Quell'assenza è un dato, non un vuoto.`,
        en:`Each row carries both reads side by side: <strong>M</strong> for the MUSE, <strong>T</strong> for the METER, and <strong>—</strong> when one saw nothing. That absence is data, not a blank.`}),
    NOTE("info",UI.L_info,{fr:`<strong>Cette vue ne contient que ce que VOUS y écrivez.</strong> Les réactions de séance y ouvraient une ligne chacune — en une séance il y en a des dizaines, et vos items s'y perdaient. Elles restent au journal et dans l'archive, où elles servent.`,
        it:`<strong>Questa vista contiene solo ciò che TU ci scrivi.</strong> Le reazioni di seduta ci aprivano una riga ciascuna — in una seduta sono decine, e i tuoi item ci si perdevano. Restano nel journal e nell'archivio, dove servono.`,
        en:`<strong>This view holds only what YOU write in it.</strong> Session reactions used to open a row each — there are dozens in a session, and your items got lost among them. They stay in the journal and the archive, where they are useful.`})]},


/* ───────────────────────── MNA ───────────────────────── */
{ id:"m-mna", grp:"mod", t:{fr:"MNA — modulation neuro-acoustique",it:"MNA — modulazione neuro-acustica",en:"MNA — neuro-acoustic modulation"},
  role:[
    P({fr:`Le MNA <strong>fait entendre</strong> l'état du préclear. Il transforme l'activité cérébrale en un son, puis propose des sons de travail. C'est le seul module qui <strong>agit</strong> sur le préclear au lieu de seulement mesurer — le son est joué dans <strong>ses</strong> écouteurs.`,
        it:`Il MNA <strong>fa sentire</strong> lo stato del preclear. Trasforma l'attività cerebrale in un suono, poi propone suoni di lavoro. È l'unico modulo che <strong>agisce</strong> sul preclear invece di limitarsi a misurare — il suono è riprodotto nelle <strong>sue</strong> cuffie.`,
        en:`MNA <strong>makes the preclear's state audible</strong>. It turns brain activity into sound, then offers working tones. It is the only module that <strong>acts</strong> on the preclear rather than only measuring — the sound plays in <strong>their</strong> headphones.`})],
  on:[ P({fr:`Cochez <strong>🎵 MNA</strong> dans CONFIG → modules visibles. Le panneau apparaît sous le cadran.`,
        it:`Spunta <strong>🎵 MNA</strong> in CONFIG → moduli visibili. Il pannello appare sotto il quadrante.`,
        en:`Tick <strong>🎵 MNA</strong> in CONFIG → visible modules. The panel appears below the dial.`}),
    SHOT("mna-config.png",{fr:"Activer le MNA dans CONFIG",it:"Attivare il MNA in CONFIG",en:"Turning MNA on in CONFIG"},1)],
  off:[ P({fr:`Décochez la même case. Le son s'arrête aussi via le bouton d'arrêt du panneau.`,it:`Togli la stessa spunta. Il suono si ferma anche col pulsante di stop del pannello.`,en:`Untick the same box. Sound also stops with the panel's stop button.`})],
  in:[
    SHOT("mna-detail.png",{fr:"Le panneau MNA en détail : les valeurs, les zones et les actions",it:"Il pannello MNA in dettaglio: i valori, le zone e le azioni",en:"The MNA panel in detail: the values, the zones and the actions"}),
    H4({fr:"Les grandeurs affichées",it:"Le grandezze mostrate",en:"The values shown"}),
    TABLE({fr:["Valeur","Ce qu'elle représente"],it:["Valore","Cosa rappresenta"],en:["Value","What it represents"]},[
      {fr:["I<sub>m</sub>","<strong>Intensité de masse.</strong> Combinaison des ondes rapides (bêta + gamma) rapportée aux ondes lentes (thêta). Elle monte quand le mental s'active sur quelque chose."],
       it:["I<sub>m</sub>","<strong>Intensità di massa.</strong> Combinazione delle onde rapide (beta + gamma) rapportata alle onde lente (theta). Sale quando il mentale si attiva su qualcosa."],
       en:["I<sub>m</sub>","<strong>Mass intensity.</strong> Fast waves (beta + gamma) against slow waves (theta). It rises when the mind engages with something."]},
      {fr:["f<sub>d</sub>","La <strong>fréquence dominante</strong> du moment, en hertz."],it:["f<sub>d</sub>","La <strong>frequenza dominante</strong> del momento, in hertz."],en:["f<sub>d</sub>","The <strong>dominant frequency</strong> of the moment, in hertz."]},
      {fr:["p*","Le <strong>nombre premier</strong> le plus proche de cette fréquence."],it:["p*","Il <strong>numero primo</strong> più vicino a quella frequenza."],en:["p*","The <strong>prime number</strong> closest to that frequency."]},
      {fr:["Δ","L'<strong>écart</strong> entre la fréquence et ce nombre premier. C'est lui qui donne la zone."],it:["Δ","Lo <strong>scarto</strong> tra la frequenza e quel numero primo. È lui che dà la zona."],en:["Δ","The <strong>gap</strong> between the frequency and that prime. This is what gives the zone."]}]),
    H4({fr:"Les quatre zones",it:"Le quattro zone",en:"The four zones"}),
    TABLE({fr:["Zone","Écart Δ","Lecture"],it:["Zona","Scarto Δ","Lettura"],en:["Zone","Gap Δ","Reading"]},[
      {fr:["<span style='color:#56cfe1'>PRIME</span>","moins de 0,5","La fréquence tombe sur un nombre premier : état le plus net."],it:["<span style='color:#56cfe1'>PRIME</span>","meno di 0,5","La frequenza cade su un numero primo: stato più netto."],en:["<span style='color:#56cfe1'>PRIME</span>","under 0.5","The frequency lands on a prime: the cleanest state."]},
      {fr:["<span style='color:#e8c170'>SEMANTIC</span>","jusqu'à 3","Proche d'un premier — sens en cours de formation."],it:["<span style='color:#e8c170'>SEMANTIC</span>","fino a 3","Vicino a un primo — senso in formazione."],en:["<span style='color:#e8c170'>SEMANTIC</span>","up to 3","Near a prime — meaning forming."]},
      {fr:["<span style='color:#ff9b3d'>COMPOSITE</span>","jusqu'à 7","Plusieurs fréquences enchevêtrées."],it:["<span style='color:#ff9b3d'>COMPOSITE</span>","fino a 7","Più frequenze intrecciate."],en:["<span style='color:#ff9b3d'>COMPOSITE</span>","up to 7","Several tangled frequencies."]},
      {fr:["<span style='color:#d04545'>MASSIVE</span>","au-delà de 7","Loin de tout premier : masse dense."],it:["<span style='color:#d04545'>MASSIVE</span>","oltre 7","Lontano da ogni primo: massa densa."],en:["<span style='color:#d04545'>MASSIVE</span>","beyond 7","Far from any prime: dense mass."]}]),
    H4({fr:"Les quatre actions",it:"Le quattro azioni",en:"The four actions"}),
    UL({fr:[`<strong>CAPTURE</strong> — fige le spectre du moment. L'app verrouille le <strong>pic</strong> de I<sub>m</sub> des dernières secondes, pas la valeur instantanée : cela compense le délai entre ce que vous voyez et ce que le préclear vit.`,
            `<strong>SONIFIER</strong> — joue la fréquence dominante : le préclear <em>entend</em> son propre état.`,
            `<strong>NETTOYAGE</strong> — joue le son de travail construit sur l'écart à la fréquence première.`,
            `<strong>HARMONIQUES</strong> — diffuse la série des harmoniques (fondamentale × nombres premiers). Ce n'est <strong>pas</strong> un son de relaxation : les harmoniques servent à <strong>effacer les copies</strong> — les répliques de la masse qui subsistent après le travail sur la fréquence principale. Le panneau liste les copies traitées.`],
        it:[`<strong>CAPTURE</strong> — fissa lo spettro del momento. L'app blocca il <strong>picco</strong> di I<sub>m</sub> degli ultimi secondi, non il valore istantaneo: così compensa il ritardo tra ciò che vedi e ciò che il preclear vive.`,
            `<strong>SONIFICA</strong> — riproduce la frequenza dominante: il preclear <em>sente</em> il proprio stato.`,
            `<strong>PULIZIA</strong> — riproduce il suono di lavoro costruito sullo scarto dalla frequenza prima.`,
            `<strong>ARMONICHE</strong> — diffonde la serie delle armoniche (fondamentale × numeri primi). <strong>Non</strong> è un suono di rilassamento: le armoniche servono a <strong>cancellare le copie</strong> — le repliche della massa che restano dopo il lavoro sulla frequenza principale. Il pannello elenca le copie trattate.`],
        en:[`<strong>CAPTURE</strong> — freezes the moment's spectrum. The app locks the <strong>peak</strong> I<sub>m</sub> of the last few seconds, not the instant value: this compensates for the delay between what you see and what the preclear lives.`,
            `<strong>SONIFY</strong> — plays the dominant frequency: the preclear <em>hears</em> their own state.`,
            `<strong>CLEAN</strong> — plays the working tone built on the gap to the prime frequency.`,
            `<strong>HARMONICS</strong> — plays the harmonic series (fundamental × primes). It is <strong>not</strong> a relaxation sound: the harmonics serve to <strong>erase the copies</strong> — the replicas of the mass that remain after working on the main frequency. The panel lists the copies handled.`]}),
    NOTE("warn",UI.L_warn,{fr:`Le MNA est <strong>manuel</strong> : c'est vous qui déclenchez chaque action, il n'y a pas de déclenchement automatique. En séance à distance, l'ordre est relayé à l'appareil du préclear pour que le son sorte <strong>dans ses écouteurs</strong>, pas dans les vôtres.`,
        it:`Il MNA è <strong>manuale</strong>: sei tu a lanciare ogni azione, non c'è alcun avvio automatico. In seduta a distanza l'ordine è inoltrato all'apparecchio del preclear perché il suono esca <strong>nelle sue cuffie</strong>, non nelle tue.`,
        en:`MNA is <strong>manual</strong>: you trigger each action, there is no automatic firing. In a remote session the command is relayed to the preclear's device so the sound comes out <strong>in their headphones</strong>, not yours.`}),
    SHOT("mna-actions.png",{fr:"Les boutons d'action du MNA",it:"I pulsanti d'azione del MNA",en:"The MNA action buttons"})]},

/* ───────────────────────── JOURNAL ───────────────────────── */
{ id:"m-journal", grp:"mod", t:{fr:"Journal de séance",it:"Journal della seduta",en:"Session journal"},
  role:[
    P({fr:`Le fil horodaté de tout ce qui s'est passé : les paroles, les réactions de l'aiguille, les cycles, les items assessés, les événements techniques. C'est la <strong>trace</strong> qui alimente le rapport.`,
        it:`Il filo cronologico di tutto ciò che è successo: le parole, le reazioni dell'ago, i cicli, gli item valutati, gli eventi tecnici. È la <strong>traccia</strong> che alimenta il rapporto.`,
        en:`The timestamped trail of everything that happened: speech, needle reactions, cycles, assessed items, technical events. It is the <strong>record</strong> that feeds the report.`}),
    TABLE({fr:["Préfixe","Contenu"],it:["Prefisso","Contenuto"],en:["Prefix","Content"]},[
      {fr:["Aud","Ce que dit l'auditeur (transcription vocale)."],it:["Aud","Ciò che dice l'auditor (trascrizione vocale)."],en:["Aud","What the auditor says (voice transcript)."]},
      {fr:["PC","Ce que dit le préclear, avec une indication de <strong>ton</strong> (calme, neutre, tendu, stressé)."],it:["PC","Ciò che dice il preclear, con un'indicazione di <strong>tono</strong> (calmo, neutro, teso, stressato)."],en:["PC","What the preclear says, with a <strong>tone</strong> indication (calm, neutral, tense, stressed)."]},
      {fr:["⊙ / ◎","Les réactions de l'aiguille et les événements de cycle (CONTACT, NULL, MIRROR, ASSESSMENT)."],it:["⊙ / ◎","Le reazioni dell'ago e gli eventi di ciclo (CONTACT, NULL, MIRROR, ASSESSMENT)."],en:["⊙ / ◎","Needle reactions and cycle events (CONTACT, NULL, MIRROR, ASSESSMENT)."]},
      {fr:["SYS","Les messages techniques : connexion MUSE, contact des électrodes, diagnostics."],it:["SYS","I messaggi tecnici: connessione MUSE, contatto elettrodi, diagnostica."],en:["SYS","Technical messages: MUSE connection, electrode contact, diagnostics."]}]),
    SHOT("journal-panneau.png",{fr:"Le journal pendant une séance",it:"Il journal durante una seduta",en:"The journal during a session"})],
  on:[ P({fr:`Cochez <strong>📋 Journal</strong> dans CONFIG.`,it:`Spunta <strong>📋 Journal</strong> in CONFIG.`,en:`Tick <strong>📋 Journal</strong> in CONFIG.`})],
  off:[ P({fr:`Décochez la case, ou réduisez le panneau par son en-tête pour le garder à portée sans qu'il prenne de place.`,
        it:`Togli la spunta, o riduci il pannello dalla sua intestazione per tenerlo a portata senza occupare spazio.`,
        en:`Untick the box, or collapse the panel from its header to keep it handy without taking space.`})],
  in:[
    P({fr:`Le journal s'écrit en continu et part <strong>tel quel</strong> dans le rapport et le PDF. Les réactions de l'aiguille y sont inscrites avec un espacement minimum, pour qu'on puisse les distinguer les unes des autres plutôt que d'avoir un flot illisible.`,
        it:`Il journal si scrive di continuo e finisce <strong>così com'è</strong> nel rapporto e nel PDF. Le reazioni dell'ago vi sono iscritte con una spaziatura minima, così si distinguono l'una dall'altra invece di essere un flusso illeggibile.`,
        en:`The journal writes continuously and goes <strong>as is</strong> into the report and the PDF. Needle reactions are logged with a minimum spacing so they can be told apart instead of forming an unreadable stream.`}),
    NOTE("ok",UI.L_ok,{fr:`Une séance interrompue (coupure, fermeture accidentelle) est <strong>récupérable</strong> : l'app en garde une copie de secours et vous propose de la reprendre au prochain lancement.`,
        it:`Una seduta interrotta (interruzione, chiusura accidentale) è <strong>recuperabile</strong>: l'app ne conserva una copia di scorta e ti propone di riprenderla al lancio successivo.`,
        en:`An interrupted session (crash, accidental close) is <strong>recoverable</strong>: the app keeps a backup copy and offers to resume it at the next launch.`})]},

/* ───────────────────────── SANTÉ SYSTÈME ───────────────────────── */
{ id:"m-sante", grp:"mod", t:{fr:"Santé système — les capteurs",it:"Salute sistema — i sensori",en:"System health — the sensors"},
  role:[
    P({fr:`La vue directe sur le matériel. C'est ici qu'on vérifie que le casque <strong>capte vraiment</strong> avant d'accuser une lecture d'être fausse.`,
        it:`La vista diretta sull'hardware. È qui che si verifica che il casco <strong>capti davvero</strong> prima di accusare una lettura di essere falsa.`,
        en:`The direct view on the hardware. This is where you check the headset is <strong>really picking up</strong> before blaming a read.`}),
    TABLE({fr:["Panneau","Ce qu'il montre"],it:["Pannello","Cosa mostra"],en:["Panel","What it shows"]},[
      {fr:["EEG","Le signal des 4 électrodes (TP9, AF7, AF8, TP10). Un tracé vivant = contact ; un trait plat = électrode décollée."],it:["EEG","Il segnale dei 4 elettrodi (TP9, AF7, AF8, TP10). Un tracciato vivo = contatto; una linea piatta = elettrodo staccato."],en:["EEG","The 4 electrodes' signal (TP9, AF7, AF8, TP10). A live trace = contact; a flat line = electrode lifted."]},
      {fr:["GYRO","Le radar 3 axes des mouvements de tête — utile pour comprendre après coup une lecture douteuse."],it:["GYRO","Il radar 3 assi dei movimenti della testa — utile per capire a posteriori una lettura dubbia."],en:["GYRO","The 3-axis radar of head movements — useful to understand a doubtful read afterwards."]},
      {fr:["PPG","Le pouls optique et le rythme cardiaque (BPM)."],it:["PPG","Il battito ottico e il ritmo cardiaco (BPM)."],en:["PPG","The optical pulse and heart rate (BPM)."]},
      {fr:["Capteurs","L'état général du MUSE et le niveau de batterie."],it:["Sensori","Lo stato generale del MUSE e il livello batteria."],en:["Sensors","The MUSE's overall state and battery level."]}]),
    SHOT("sante-panneau.png",{fr:"Les quatre panneaux de santé système",it:"I quattro pannelli di salute sistema",en:"The four system-health panels"})],
  on:[ P({fr:`Cochez <strong>💚 Santé système</strong> dans CONFIG.`,it:`Spunta <strong>💚 Salute sistema</strong> in CONFIG.`,en:`Tick <strong>💚 System health</strong> in CONFIG.`})],
  off:[ P({fr:`Décochez la case. On la garde en général visible pendant l'installation du casque, puis on la referme pour dégager l'écran.`,
        it:`Togli la spunta. In genere si tiene visibile mentre si sistema il casco, poi si chiude per liberare lo schermo.`,
        en:`Untick the box. It is usually kept visible while fitting the headset, then closed to clear the screen.`})],
  in:[
    P({fr:`L'app juge le contact sur la <strong>forme</strong> du signal, pas sur sa force : un vrai signal cérébral vibre autour d'une moyenne. Une électrode décollée donne soit un trait plat, soit une saturation — les deux sont reconnues et écartées. Sans contact, la charge est forcée à zéro et l'aiguille reste au repos : mieux vaut ne rien montrer qu'une charge fantôme.`,
        it:`L'app giudica il contatto sulla <strong>forma</strong> del segnale, non sulla sua forza: un vero segnale cerebrale vibra attorno a una media. Un elettrodo staccato dà o una linea piatta o una saturazione — entrambe sono riconosciute e scartate. Senza contatto la carica è forzata a zero e l'ago resta a riposo: meglio non mostrare nulla che una carica fantasma.`,
        en:`The app judges contact on the signal's <strong>shape</strong>, not its strength: a real brain signal vibrates around a mean. A lifted electrode gives either a flat line or a saturation — both are recognised and rejected. Without contact the charge is forced to zero and the needle rests: better to show nothing than a phantom charge.`}),
    NOTE("info",UI.L_note,{fr:`Quand le contact se perd, une ligne de diagnostic est écrite au journal, électrode par électrode. C'est le premier endroit à regarder si l'aiguille semble morte.`,
        it:`Quando il contatto si perde, una riga di diagnostica viene scritta nel journal, elettrodo per elettrodo. È il primo posto da guardare se l'ago sembra morto.`,
        en:`When contact is lost, a diagnostic line is written to the journal, electrode by electrode. It's the first place to look if the needle seems dead.`})]},

/* ───────────────────────── CAMÉRAS ───────────────────────── */
{ id:"m-cams", grp:"mod", t:{fr:"Caméras — CAM 1 & CAM 2",it:"Camere — CAM 1 & CAM 2",en:"Cameras — CAM 1 & CAM 2"},
  role:[
    P({fr:`<strong>CAM 1</strong> montre l'auditeur, <strong>CAM 2</strong> le préclear. En séance à distance, elles remplacent la présence physique : on voit le visage, la posture, les signes somatiques que l'aiguille ne dit pas.`,
        it:`<strong>CAM 1</strong> mostra l'auditor, <strong>CAM 2</strong> il preclear. In seduta a distanza sostituiscono la presenza fisica: si vede il viso, la postura, i segni somatici che l'ago non dice.`,
        en:`<strong>CAM 1</strong> shows the auditor, <strong>CAM 2</strong> the preclear. In remote sessions they replace physical presence: you see the face, the posture, the somatic signs the needle does not tell.`}),
    SHOT("cams-vues.png",{fr:"Les deux retours vidéo",it:"I due ritorni video",en:"The two video feeds"})],
  on:[ P({fr:`Cochez <strong>📷 CAM 1</strong> et/ou <strong>📷 CAM 2</strong> dans CONFIG. Le système demandera l'autorisation d'accès à la caméra la première fois.`,
        it:`Spunta <strong>📷 CAM 1</strong> e/o <strong>📷 CAM 2</strong> in CONFIG. Il sistema chiederà l'autorizzazione alla camera la prima volta.`,
        en:`Tick <strong>📷 CAM 1</strong> and/or <strong>📷 CAM 2</strong> in CONFIG. The system will ask for camera permission the first time.`})],
  off:[ P({fr:`Décochez la case correspondante — le flux est coupé, la caméra libérée.`,it:`Togli la spunta corrispondente — il flusso si interrompe, la camera è liberata.`,en:`Untick the matching box — the feed stops and the camera is released.`})],
  in:[
    P({fr:`En local, la caméra est celle de la machine. À distance, la vidéo du préclear voyage <strong>directement</strong> vers vous, sans passer par un serveur qui la stockerait.`,
        it:`In locale la camera è quella della macchina. A distanza il video del preclear viaggia <strong>direttamente</strong> verso di te, senza passare da un server che lo conserverebbe.`,
        en:`Locally the camera is the machine's own. Remotely the preclear's video travels <strong>directly</strong> to you, without passing through a server that would store it.`}),
    NOTE("ok",UI.L_ok,{fr:`Un téléphone sur le même réseau peut servir de <strong>caméra secondaire</strong> — pour filmer le préclear qui est assis <strong>face à l'ordinateur</strong>.`,
        it:`Un telefono sulla stessa rete può fare da <strong>camera secondaria</strong> — per riprendere il preclear seduto <strong>di fronte al computer</strong>.`,
        en:`A phone on the same network can act as a <strong>secondary camera</strong> — to film the preclear sitting <strong>facing the computer</strong>.`})]},

/* ───────────────────────── INTÉGRITÉ ───────────────────────── */
{ id:"m-integrite", grp:"mod", t:{fr:"Intégrité biométrique",it:"Integrità biometrica",en:"Biometric integrity"},
  role:[
    P({fr:`Une barre qui suit <strong>le niveau de charge en direct</strong>, lissé, en pourcentage. Elle donne d'un coup d'œil l'amplitude de ce que l'instrument reçoit : à zéro quand le MUSE n'est pas connecté, elle monte avec l'activité mesurée.`,
        it:`Una barra che segue <strong>il livello di carica in diretta</strong>, lisciato, in percentuale. Dà a colpo d'occhio l'ampiezza di ciò che lo strumento riceve: a zero quando il MUSE non è connesso, sale con l'attività misurata.`,
        en:`A bar that follows the <strong>live charge level</strong>, smoothed, as a percentage. It gives an at-a-glance sense of how much the instrument is receiving: zero when the MUSE is not connected, rising with measured activity.`}),
    SHOT("integrite-barre.png",{fr:"La barre d'intégrité biométrique",it:"La barra di integrità biometrica",en:"The biometric integrity bar"},1)],
  on:[ P({fr:`Cochez <strong>📊 Intégrité biométrique</strong> dans CONFIG.`,it:`Spunta <strong>📊 Integrità biometrica</strong> in CONFIG.`,en:`Tick <strong>📊 Biometric integrity</strong> in CONFIG.`})],
  off:[ P({fr:`Décochez la même case.`,it:`Togli la stessa spunta.`,en:`Untick the same box.`})],
  in:[
    NOTE("warn",UI.L_warn,{fr:`Ne confondez pas avec la <strong>qualité du signal</strong> : pour juger si les électrodes tiennent, c'est <strong>Santé système</strong> qu'il faut regarder. Cette barre-ci reflète l'amplitude de la charge mesurée, pas la fiabilité du contact.`,
        it:`Non confonderla con la <strong>qualità del segnale</strong>: per giudicare se gli elettrodi tengono, va guardata <strong>Salute sistema</strong>. Questa barra riflette l'ampiezza della carica misurata, non l'affidabilità del contatto.`,
        en:`Do not confuse it with <strong>signal quality</strong>: to judge whether the electrodes hold, look at <strong>System health</strong>. This bar reflects the amplitude of the measured charge, not the reliability of contact.`})]},

/* ───────────────────────── ASSISTANT IA ───────────────────────── */
{ id:"m-ia", grp:"mod", t:{fr:"Assistant IA",it:"Assistente IA",en:"AI assistant"},
  role:[
    P({fr:`Un assistant conversationnel pour poser une question pendant la préparation — un point de procédure, une formulation, une aide à la navigation.`,
        it:`Un assistente conversazionale per porre una domanda durante la preparazione — un punto di procedura, una formulazione, un aiuto a orientarsi.`,
        en:`A conversational assistant to ask a question during preparation — a point of procedure, a wording, help finding your way.`}),
    SHOT("ia-panneau.png",{fr:"L'assistant IA",it:"L'assistente IA",en:"The AI assistant"})],
  on:[ P({fr:`Il faut d'abord renseigner une <strong>clé d'API Google AI Studio</strong> (service Gemini) dans le champ prévu. Sans clé, l'assistant vous le dira au lieu d'échouer en silence.`,
        it:`Bisogna prima inserire una <strong>chiave API Google AI Studio</strong> (servizio Gemini) nel campo previsto. Senza chiave l'assistente te lo dirà invece di fallire in silenzio.`,
        en:`You must first enter a <strong>Google AI Studio API key</strong> (Gemini service) in the field provided. Without a key the assistant will say so rather than failing silently.`}),
    SHOT("ia-cle.png",{fr:"La saisie de la clé API",it:"L'inserimento della chiave API",en:"Entering the API key"},1)],
  off:[ P({fr:`Fermez le panneau : l'assistant ne tourne pas en arrière-plan.`,it:`Chiudi il pannello: l'assistente non gira in secondo piano.`,en:`Close the panel: the assistant does not run in the background.`})],
  in:[
    NOTE("warn",UI.L_warn,{fr:`<strong>Confidentialité.</strong> La clé est enregistrée <strong>uniquement dans votre navigateur</strong> et n'est envoyée nulle part ailleurs. Seule votre question part chez Google — aucune donnée biométrique, aucun nom de préclear, aucun contenu de séance n'est transmis automatiquement.|En revanche, <strong>ce que vous tapez vous-même part vraiment</strong> : n'écrivez pas dans l'assistant le contenu confidentiel d'une séance.`,
        it:`<strong>Riservatezza.</strong> La chiave è salvata <strong>solo nel tuo browser</strong> e non viene inviata altrove. Solo la tua domanda va a Google — nessun dato biometrico, nessun nome di preclear, nessun contenuto di seduta viene trasmesso automaticamente.|Però <strong>ciò che scrivi tu parte davvero</strong>: non scrivere nell'assistente il contenuto riservato di una seduta.`,
        en:`<strong>Confidentiality.</strong> The key is stored <strong>only in your browser</strong> and is sent nowhere else. Only your question goes to Google — no biometric data, no preclear name, no session content is transmitted automatically.|However, <strong>what you type does travel</strong>: do not write confidential session content into the assistant.`})]},

/* ───────────────────────── HISTORIQUE / PROCESSUS / TRIM ───────────────────────── */
{ id:"m-outils", grp:"mod", t:{fr:"Historique, Processus et TRIM",it:"Storico, Processus e TRIM",en:"History, Processes and TRIM"},
  role:[
    TABLE({fr:["Outil","À quoi il sert"],it:["Strumento","A cosa serve"],en:["Tool","What it is for"]},[
      {fr:["Historique","Toutes les séances passées, par profil, avec leurs rapports PDF. On y relit une séance, on y retrouve les items déjà vus."],it:["Storico","Tutte le sedute passate, per profilo, coi loro rapporti PDF. Ci si rilegge una seduta, si ritrovano gli item già visti."],en:["History","All past sessions, by profile, with their PDF reports. Re-read a session, find items already seen."]},
      {fr:["Processus","La bibliothèque de documents (PDF) que vous gardez à portée pendant la séance : listes, procédures, références."],it:["Processus","La biblioteca di documenti (PDF) che tieni a portata durante la seduta: liste, procedure, riferimenti."],en:["Processes","The library of documents (PDF) you keep at hand during the session: lists, procedures, references."]},
      {fr:["TRIM","Le recentrage de l'aiguille — comme le bouton de centrage d'un e-mètre. À ajuster si l'aiguille repose trop à gauche ou trop à droite."],it:["TRIM","Il ricentraggio dell'ago — come la manopola di centraggio di un e-meter. Da regolare se l'ago riposa troppo a sinistra o a destra."],en:["TRIM","Needle re-centring — like an e-meter's centring knob. Adjust if the needle rests too far left or right."]}]),
    SHOT("outils-sidebar.png",{fr:"Les outils de la barre latérale",it:"Gli strumenti della barra laterale",en:"The sidebar tools"})],
  on:[ P({fr:`Chaque outil a son bouton dans la barre latérale gauche.`,it:`Ogni strumento ha il suo pulsante nella barra laterale sinistra.`,en:`Each tool has its button in the left sidebar.`})],
  off:[ P({fr:`Re-cliquez sur le même bouton, ou fermez la fenêtre ouverte.`,it:`Ri-clicca sullo stesso pulsante, o chiudi la finestra aperta.`,en:`Click the same button again, or close the open window.`})],
  in:[ P({fr:`Les séances et les documents sont stockés <strong>sur votre machine</strong>. Les PDF de séance sont conservés à part pour rester consultables même après un nettoyage du navigateur.`,
        it:`Le sedute e i documenti sono conservati <strong>sulla tua macchina</strong>. I PDF di seduta sono tenuti a parte per restare consultabili anche dopo una pulizia del browser.`,
        en:`Sessions and documents are stored <strong>on your machine</strong>. Session PDFs are kept separately so they stay readable even after a browser cleanup.`})]},

/* ───────────────────────── RAPPORT ───────────────────────── */
{ id:"m-rapport", grp:"end", t:{fr:"Rapport de fin de séance & PDF",it:"Rapporto di fine seduta & PDF",en:"End-of-session report & PDF"},
  role:[
    P({fr:`À la fin de la séance, tout ce qui a été enregistré est rassemblé en un rapport, sauvegardé et exporté en PDF.`,
        it:`Alla fine della seduta, tutto ciò che è stato registrato viene raccolto in un rapporto, salvato ed esportato in PDF.`,
        en:`At the end of the session, everything recorded is gathered into a report, saved and exported as a PDF.`}),
    UL({fr:[`Les <strong>cycles CONTACT</strong> (menés ou non à l'AS-IS), avec le temps de réaction mesuré.`,
            `Les <strong>cycles NULL</strong> séparément (CLEAR READ, VGI's, « no recharging »).`,
            `Les <strong>cycles MIRROR</strong> : valeur de chaque item, son double, obtenu ou non, et le <strong>total de la séance</strong>.`,
            `Les <strong>items ASSESSMENT</strong> avec leur READ et le temps −ms.`,
            `Le <strong>Total TA</strong>, les zones de travail, la courbe de charge et la transcription complète.`],
        it:[`I <strong>cicli CONTACT</strong> (portati o no all'AS-IS), col tempo di reazione misurato.`,
            `I <strong>cicli NULL</strong> separatamente (CLEAR READ, VGI's, « no recharging »).`,
            `I <strong>cicli MIRROR</strong>: valore di ogni item, il suo doppio, ottenuto o no, e il <strong>totale della seduta</strong>.`,
            `Gli <strong>item ASSESSMENT</strong> col loro READ e il tempo −ms.`,
            `Il <strong>Total TA</strong>, le zone di lavoro, la curva di carica e la trascrizione completa.`],
        en:[`The <strong>CONTACT cycles</strong> (taken to AS-IS or not), with the measured reaction time.`,
            `The <strong>NULL cycles</strong> separately (CLEAR READ, VGI's, "no recharging").`,
            `The <strong>MIRROR cycles</strong>: each item's value, its double, obtained or not, and the <strong>session total</strong>.`,
            `The <strong>ASSESSMENT items</strong> with their READ and the −ms time.`,
            `The <strong>Total TA</strong>, the working zones, the charge curve and the full transcript.`]}),
    SHOT("rapport-vue.png",{fr:"Le rapport de fin de séance",it:"Il rapporto di fine seduta",en:"The end-of-session report"})],
  on:[ P({fr:`Terminez la séance : le rapport s'ouvre de lui-même.`,it:`Termina la seduta: il rapporto si apre da solo.`,en:`End the session: the report opens by itself.`})],
  off:[ P({fr:`Fermez la fenêtre — la séance reste enregistrée dans l'historique et le PDF est déjà produit.`,
        it:`Chiudi la finestra — la seduta resta registrata nello storico e il PDF è già prodotto.`,
        en:`Close the window — the session stays in history and the PDF is already produced.`})],
  in:[ P({fr:`Un cycle laissé ouvert est consigné comme <strong>non mené à terme</strong> plutôt que d'être effacé : le rapport dit ce qui s'est passé, pas ce qu'on aurait voulu.`,
        it:`Un ciclo lasciato aperto è registrato come <strong>non portato a termine</strong> invece di essere cancellato: il rapporto dice ciò che è successo, non ciò che si sarebbe voluto.`,
        en:`A cycle left open is logged as <strong>not completed</strong> rather than erased: the report says what happened, not what you would have liked.`}),
    SHOT("rapport-pdf.png",{fr:"Le PDF exporté",it:"Il PDF esportato",en:"The exported PDF"})]},

/* ───────────────────────── DÉPANNAGE ───────────────────────── */
{ id:"m-corpus", grp:"end", t:{fr:"CORPUS — l'archive pour l'IA",it:"CORPUS — l'archivio per l'IA",en:"CORPUS — the archive for the AI"},
  role:[
    P({fr:`À côté des rapports, EQUILIBRIUM écrit une <strong>archive d'expérience</strong> destinée à une IA : ce que font les deux aiguilles par rapport aux cycles d'audition, le temps de réaction de chacune, la quantité de charge, la concordance des F/N, et — si l'auditeur l'a indiqué — le <strong>procédé</strong> qui tournait. Le but est qu'un EQUILIBRIUM neuf puisse hériter de l'expérience accumulée dès sa première connexion.`,
        it:`Accanto ai rapporti, EQUILIBRIUM scrive un <strong>archivio di esperienza</strong> destinato a un'IA: cosa fanno i due aghi rispetto ai cicli di auditing, il tempo di reazione di ciascuno, la quantità di carica, la concordanza degli F/N e — se l'auditor l'ha indicato — il <strong>procedimento</strong> che stava girando. Lo scopo è che un EQUILIBRIUM nuovo possa ereditare l'esperienza accumulata già alla prima connessione.`,
        en:`Alongside the reports, EQUILIBRIUM writes an <strong>experience archive</strong> meant for an AI: what the two needles do relative to the auditing cycles, each one's reaction time, the amount of charge, the F/N concordance, and — if the auditor indicated it — the <strong>process</strong> that was running. The aim is that a fresh EQUILIBRIUM can inherit the accumulated experience from its first connection.`}),
    NOTE("ok",UI.L_ok,{fr:`Aucun <strong>nom</strong>, aucune <strong>parole prononcée</strong>, aucun <strong>contenu d'item</strong> n'y entre. Uniquement des nombres, des temps, et le nom du procédé — qui est technique, pas personnel. Le fichier peut donc se copier, se fusionner et se donner à un modèle sans emporter quoi que ce soit de privé.`,
        it:`Nessun <strong>nome</strong>, nessuna <strong>parola detta</strong>, nessun <strong>contenuto d'item</strong> ci entra. Solo numeri, tempi e il nome del procedimento — che è tecnico, non personale. Il file si può quindi copiare, fondere e dare a un modello senza portarsi dietro nulla di privato.`,
        en:`No <strong>names</strong>, no <strong>spoken words</strong>, no <strong>item content</strong> goes in. Only numbers, times and the process name — which is technical, not personal. The file can therefore be copied, merged and fed to a model without carrying anything private.`})],
  on:[ P({fr:`Rien à activer : l'archive s'écrit d'elle-même pendant la séance, dans le dossier <code>EQUILIBRIUM/corpus/</code> de votre répertoire personnel, un fichier <strong>par mois</strong> (<code>2026-07.jsonl</code>).`,
        it:`Niente da attivare: l'archivio si scrive da sé durante la seduta, nella cartella <code>EQUILIBRIUM/corpus/</code> della tua directory personale, un file <strong>al mese</strong> (<code>2026-07.jsonl</code>).`,
        en:`Nothing to switch on: the archive writes itself during the session, in the <code>EQUILIBRIUM/corpus/</code> folder of your home directory, one file <strong>per month</strong> (<code>2026-07.jsonl</code>).`}),
    P({fr:`Pour que le <strong>procédé</strong> y figure, il suffit de l'indiquer dans le champ d'objectif de la séance. Sans lui, les réactions sont un tas de nombres ; avec lui on peut demander « quel processus donne des blowdowns, lequel donne des F/N ? » — c'est de la connaissance clinique.`,
        it:`Perché il <strong>procedimento</strong> vi figuri, basta indicarlo nel campo dell'obiettivo della seduta. Senza di esso le reazioni sono un mucchio di numeri; con esso si può chiedere « quale processo dà blowdown, quale dà F/N? » — è conoscenza clinica.`,
        en:`For the <strong>process</strong> to appear there, simply state it in the session objective field. Without it the reactions are a heap of numbers; with it one can ask "which process gives blowdowns, which gives F/Ns?" — that is clinical knowledge.`})],
  off:[ P({fr:`Supprimez le dossier <code>EQUILIBRIUM/corpus/</code> si vous ne voulez pas d'archive. Rien d'autre n'en dépend : les rapports de séance sont indépendants.`,
        it:`Cancella la cartella <code>EQUILIBRIUM/corpus/</code> se non vuoi l'archivio. Nient'altro ne dipende: i rapporti di seduta sono indipendenti.`,
        en:`Delete the <code>EQUILIBRIUM/corpus/</code> folder if you do not want an archive. Nothing else depends on it: session reports are independent.`})],
  in:[
    H4({fr:"Ce que vous avez à faire",it:"Cosa devi fare",en:"What you have to do"}),
    P({fr:`Rien, sauf une chose : <strong>indiquez le procédé</strong> dans le champ d'objectif de la séance. C'est le seul renseignement que l'app ne peut pas deviner, et c'est celui qui donne son sens à tout le reste — sans lui, l'archive est une suite de nombres ; avec lui, on peut savoir quel processus fait quoi.`,
        it:`Niente, tranne una cosa: <strong>indica il procedimento</strong> nel campo dell'obiettivo della seduta. È l'unica informazione che l'app non può indovinare, ed è quella che dà senso a tutto il resto — senza, l'archivio è una sequenza di numeri; con, si può sapere quale processo fa cosa.`,
        en:`Nothing, except one thing: <strong>state the process</strong> in the session objective field. It is the only piece the app cannot guess, and the one that gives everything else its meaning — without it the archive is a string of numbers; with it, you can learn what each process does.`}),
    H4({fr:"Où c'est, et comment l'emporter",it:"Dov'è, e come portarlo via",en:"Where it is, and how to take it"}),
    P({fr:`Un fichier par mois dans <code>EQUILIBRIUM/corpus/</code>, dans votre dossier personnel. Pour l'envoyer, copiez le fichier — rien d'autre à préparer. Deux machines se réunissent en <strong>mettant les fichiers bout à bout</strong> : il n'y a pas de fusion à faire.`,
        it:`Un file al mese in <code>EQUILIBRIUM/corpus/</code>, nella tua cartella personale. Per spedirlo, copia il file — niente altro da preparare. Due macchine si uniscono <strong>mettendo i file uno dopo l'altro</strong>: non c'è nessuna fusione da fare.`,
        en:`One file per month in <code>EQUILIBRIUM/corpus/</code>, in your home folder. To send it, copy the file — nothing else to prepare. Two machines are merged by <strong>putting the files end to end</strong>: there is no merging to do.`}),
    NOTE("ok",UI.L_ok,{fr:`Vous pouvez l'envoyer sans crainte : il ne contient <strong>aucun nom, aucune parole prononcée, aucun contenu d'item</strong>. Des nombres, des temps, et le nom du procédé.`,
        it:`Puoi spedirlo senza timore: non contiene <strong>nessun nome, nessuna parola detta, nessun contenuto d'item</strong>. Numeri, tempi, e il nome del procedimento.`,
        en:`You can send it without worry: it contains <strong>no names, no spoken words, no item content</strong>. Numbers, times, and the process name.`}),
    NOTE("warn",UI.L_warn,{fr:`Pour ne plus rien archiver, supprimez le dossier <code>EQUILIBRIUM/corpus/</code>. Les rapports de séance, eux, ne dépendent pas de lui et restent intacts.`,
        it:`Per non archiviare più nulla, cancella la cartella <code>EQUILIBRIUM/corpus/</code>. I rapporti di seduta non dipendono da lei e restano intatti.`,
        en:`To stop archiving, delete the <code>EQUILIBRIUM/corpus/</code> folder. Session reports do not depend on it and stay intact.`})]},
{ id:"m-depannage", grp:"end", t:{fr:"Quand ça coince",it:"Quando qualcosa non va",en:"When something goes wrong"},
  role:[

      {fr:["Le MUSE se déconnecte","L'app tente 6 reconnexions sur 30 s. Si le casque ne répond plus, elle abandonne proprement : rallumez le bandeau et re-pressez CONNECTER."],
       it:["Il MUSE si disconnette","L'app tenta 6 riconnessioni in 30 s. Se il casco non risponde più, si arrende pulitamente: riaccendi il casco e ripremi CONNETTI."],
       en:["The MUSE disconnects","The app tries 6 reconnects over 30 s. If the headset no longer responds it gives up cleanly: power it back on and press CONNECT again."]},
      {fr:["« Pas de contact »","Repositionnez le bandeau (front + derrière les oreilles), humidifiez légèrement la peau. Le journal indique quelle électrode manque."],

      {fr:["Beaucoup de NULL","Normal si l'aiguille flotte déjà (F/N continue) — c'est la définition de l'ago nullo. Sinon, vérifiez le contact."],

const MODULES = MODULES_CORE.concat(MODULES_REST);
/* ═══ RENDU ═══ */
const GROUPS = [
  { k:"core", label:UI.navCore },
  { k:"dial", label:UI.navDial },
  { k:"mod",  label:UI.navMod  },
  { k:"end",  label:UI.navEnd  },
];

function buildNav(){
  let h = `<div class="sec">${tr(UI.navGuide)}</div><a class="nl" href="#guide">${tr(UI.tuto)}</a>`;
  for (const g of GROUPS){
    const mods = MODULES.filter(m => m.grp === g.k);
    if (!mods.length) continue;
    h += `<div class="sec">${tr(g.label)}</div>`;
    h += mods.map(m => `<a class="nl" href="#${m.id}">${tr(m.t)}</a>`).join("");
  }
  document.getElementById("navlinks").innerHTML = h;
}

function buildDoc(){
  /* en-tête */
  let h = `<div class="hero">
    <div class="eyebrow">${tr(UI.eyebrow)}</div>
    <h2>${tr(UI.sub)}</h2>
    <p class="lead">${tr(UI.lede)}</p>
  </div>
  <aside class="note info"><span class="nl">${tr(UI.shotHow)}</span><p>${tr(UI.shotTxt)}</p></aside>`;

  /* tutoriel */
  h += `<h2 id="guide">${tr(UI.tuto)}</h2>`;
  h += STEPS.map(s => `<div class="step">
      <div class="sn">${String(s.n).padStart(2,"0")}</div>
      <h4>${tr(s.t)}</h4>
      <p>${tr(s.d)}</p>
      ${SHOT(s.s, s.t)()}
    </div>`).join("");

  /* catalogue */
  h += `<h2 id="catalogue">${tr(UI.catalog)}</h2>`;
  for (const g of GROUPS){
    const mods = MODULES.filter(m => m.grp === g.k);
    if (!mods.length) continue;
    h += `<h2 style="font-size:1.15rem;color:var(--muted);border:none;margin:2.4rem 0 .8rem;
           font-family:var(--mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase">${tr(g.label)}</h2>`;
    h += mods.map(m => {
      let np = 0;
      const part = (label, blocks) => blocks && blocks.length
        ? `<div class="part">${++np}. ${tr(label)}</div>${blocks.map(f => f()).join("")}` : "";
      return `<section class="card" id="${m.id}">
        <h3>${tr(m.t)}</h3>
        ${part(UI.h1, m.role)}
        ${part(UI.h2, m.on)}
        ${part(UI.h3, m.off)}
        ${part(UI.h4, m.in)}
      </section>`;
    }).join("");
  }

  h += `<div class="end">${tr({
    fr:`EQUILIBRIUM v${VERSIONE} — usage réservé à l'audition. Ce n'est pas un dispositif médical. Sans le THETA-METER, toutes les valeurs sont RELATIVES : le MUSE ne mesure ni ohms ni milliohms, et le TA est reconstruit. Avec le THETA-METER branché, le TA est une résistance réellement mesurée, taraudée avec l'artefact physique. Ce manuel décrit le fonctionnement réel du logiciel ; en cas de divergence avec l'écran, c'est l'écran qui fait foi.`,
    it:`EQUILIBRIUM v${VERSIONE} — uso riservato all'auditing. Non è un dispositivo medico. Senza il THETA-METER tutti i valori sono RELATIVI: il MUSE non misura né ohm né milliohm, e il TA è ricostruito. Col THETA-METER collegato, il TA è una resistenza realmente misurata, tarata con l'artefatto fisico. Questo manuale descrive il funzionamento reale del software; in caso di divergenza con lo schermo, fa fede lo schermo.`,
    en:`EQUILIBRIUM v${VERSIONE} — for auditing use. It is not a medical instrument. Without the THETA-METER all values are RELATIVE: the MUSE measures neither ohms nor milliohms, and the TA is reconstructed. With the THETA-METER connected, the TA is a genuinely measured resistance, calibrated with the physical artifact. This manual describes the software's real behaviour; if it diverges from the screen, the screen is authoritative.`})}</div>`;

  document.getElementById("doc").innerHTML = h;
  document.documentElement.lang = LANG;
  document.title = "EQUILIBRIUM — " + tr(UI.sub);
}

function render(){ buildNav(); buildDoc(); }

document.querySelectorAll(".langs button").forEach(b => {
  b.addEventListener("click", () => {
    LANG = b.dataset.lang;
    document.querySelectorAll(".langs button").forEach(x =>
      x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    render();
  });
});
render();
</script>
