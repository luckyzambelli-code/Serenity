    ]),
    NOTE("warn",UI.L_note,{fr:`<strong>Le sexe du préclair change l'échelle</strong>, et ce n'est pas un détail : au même TA 3,0 l'homme est clair (+40) et la femme est déjà descendue (+21). C'est pourquoi l'app le demande avant de commencer — sans lui, elle prend 2,0, le plus prudent.<br>Et une division de TA vaut plus de vingt divisions de ton : c'est pourquoi celle qu'on retire faute de test des boîtes pèse autant.`,
        it:`<strong>Il sesso del preclear cambia la scala</strong>, e non è un dettaglio: allo stesso TA 3,0 l'uomo è clear (+40) e la donna è già scesa (+21). È il motivo per cui l'app lo chiede prima di cominciare — senza, prende 2,0, il più prudente.<br>E una divisione di TA vale più di venti divisioni di tono: è per questo che quella tolta in mancanza della prova delle lattine pesa tanto.`,
        en:`<strong>The preclear's sex changes the scale</strong>, and it is no detail: at the same TA 3.0 a man is clear (+40) and a woman has already come down (+21). That is why the app asks before starting — without it, it takes 2.0, the more careful one.<br>And one TA division is worth over twenty tone divisions: that is why the one removed for a missing cans test weighs so much.`}),
    H4({fr:"Où se fait le test, et ce que dit le TONE ARM",it:"Dove si fa la prova, e cosa dice il TONE ARM",en:"Where the test is done, and what the TONE ARM says"}),
    UL({fr:[`<strong>Au START</strong>, mètre branché : l'écran des deux tests s'ouvre de lui-même.`,
            `<strong>En séance</strong> : le bouton ambre sous le TONE ARM le rouvre quand vous voulez.`,
            `<strong>Si vous choisissez UNE seule boîte</strong>, l'écran vous invite à faire d'abord la pression avec DEUX — c'est la référence — et propose le bouton qui bascule.`,
            `<strong>Le test DOUBLE et la comparaison</strong> — les deux pressions faites, avec deux boîtes et avec une, le cadre de <em>comparaison</em> apparaît : les deux TA et leur DIFFÉRENCE. En pressant « utilise cet écart », le TA en solo revient aux deux boîtes et la division n'est plus retirée. Un écart absurde (plus de 3 de TA) est refusé : c'est une lecture mal prise, pas une configuration.`,
            `Tout cela part dans le <strong>rapport de séance et le PDF</strong> : configuration, test fait ou non, écart mesuré ou non, divisions retirées. À froid, sans, on ne saurait pas si ce TA valait.`,
            `<strong>Le TEST DOUBLE et sa comparaison</strong> — une fois la pression faite avec deux boîtes puis avec une, un encadré montre les deux TA et leur <strong>différence</strong>. C'est la donnée qui manquait : la pression étalonne la SENSIBILITÉ de l'aiguille, mais la correction du TA est de combien le même préclair lit différemment avec une seule boîte, et cela ne se déduit pas d'un seul test. En pressant <span class="tag">UTILISE CET ÉCART</span>, le TA en solo revient aux deux boîtes et la marge disparaît. Un écart au-delà de 3 divisions est refusé : ce n'est pas une configuration, c'est une lecture mal prise.`,
            `<strong>Pourquoi la question « deux boîtes ou une »</strong> — avec DEUX le courant passe d'une main à l'autre et la résistance est celle du préclair : c'est la référence. Avec UNE seule le circuit se ferme autrement et la résistance est plus haute : le même préclair, au même instant, donne un TA différent.`,
            `Le TA affiché est <strong>toujours ramené aux deux boîtes</strong>, et sous le nombre il est écrit comment : <em>TA · 2 boîtes</em> (la référence), <em>TA · 1 boîte → 2</em> (écart mesuré, appliqué), ou <em>TA · 1 boîte − 1 division</em> — en ambre, parce que l'écart n'a pas été mesuré et que la division a été <strong>vraiment retirée</strong> : un 4 devient 3.<br><strong>L'échelle des tons se cale sur CE nombre</strong>, pas sur le TA brut : sinon, avec une seule boîte, toute l'échelle est décalée d'une division.`,
            `<strong>Sans mètre, il n'y a pas de TONE ARM.</strong> Le nombre reconstruit depuis l'EEG ne s'affiche plus : il avait l'air d'une mesure et n'en était pas une.`],
        it:[`<strong>Allo START</strong>, col meter collegato: la schermata delle due prove si apre da sé.`,
            `<strong>In seduta</strong>: il bottone ambra sotto il TONE ARM la riapre quando vuoi.`,
            `<strong>Se scegli UNA lattina sola</strong>, la schermata ti invita a fare prima la stretta con DUE — è il riferimento — e offre il bottone che ci passa.`,
            `<strong>La prova DOPPIA e il confronto</strong> — fatte le due strette, con due lattine e con una, compare il riquadro del <em>confronto</em>: i due TA e la loro DIFFERENZA. Premendo « usa questa differenza » il TA in solo si riporta alle due lattine, e la divisione non si toglie più. Uno scarto assurdo (oltre 3 di TA) viene rifiutato: è una lettura presa male, non una configurazione.`,
            `Tutto questo finisce nel <strong>rapporto di seduta e nel PDF</strong>: configurazione, prova fatta o no, scarto misurato o no, divisioni tolte. A freddo, senza, non si saprebbe se quel TA valeva.`,
            `<strong>La PROVA DOPPIA e il suo confronto</strong> — fatta la stretta con due lattine e poi con una, compare un riquadro che mostra i due TA e la loro <strong>differenza</strong>. È il dato che mancava: la stretta tara la SENSIBILITÀ dell'ago, ma la correzione del TA è di quanto lo stesso preclear legge diverso con una lattina, e quella non si deduce da una prova sola. Premendo <span class="tag">USA QUESTA DIFFERENZA</span> il TA in solo si riporta alle due lattine e il margine sparisce. Uno scarto oltre 3 divisioni viene rifiutato: non è una configurazione, è una lettura presa male.`,
            `<strong>Perché la domanda « due lattine o una »</strong> — con DUE la corrente passa da una mano all'altra e la resistenza è quella del preclear: è il riferimento. Con UNA sola il circuito si chiude altrimenti e la resistenza è più alta: lo stesso preclear, nello stesso istante, dà un TA diverso.`,
            `Il TA che vedi è <strong>sempre riportato alle due lattine</strong>, e sotto il numero c'è scritto come: <em>TA · 2 lattine</em> (il riferimento), <em>TA · 1 lattina → 2</em> (scarto misurato, applicato), oppure <em>TA · 1 lattina − 1 divisione</em> — in ambra, perché lo scarto non è stato misurato e la divisione è stata <strong>tolta davvero</strong>: un 4 diventa 3.<br><strong>La scala del tono si tara su QUESTO numero</strong>, non sul TA grezzo: se no, con una lattina sola tutta la scala è spostata di una divisione.`,
            `<strong>Senza meter non c'è TONE ARM.</strong> Il numero ricostruito dall'EEG non si mostra più: sembrava una misura e non lo era.`],
        en:[`<strong>At START</strong>, with the meter connected: the two-tests screen opens by itself.`,
            `<strong>Mid-session</strong>: the amber button under the TONE ARM reopens it whenever you want.`,
            `<strong>If you pick ONE can</strong>, the screen invites you to do the squeeze with TWO first — that is the reference — and offers the button that switches.`,
            `<strong>The DOUBLE test and the comparison</strong> — with both squeezes done, two cans and one, the <em>comparison</em> box appears: the two TAs and their DIFFERENCE. Pressing "use this offset" brings the solo TA back to two cans, and the division is no longer taken off. An absurd gap (over 3 of TA) is refused: that is a badly taken reading, not a configuration.`,
            `All of it goes into the <strong>session report and the PDF</strong>: configuration, test done or not, offset measured or not, divisions removed. Cold, without it, you would not know whether that TA was worth anything.`,
            `<strong>The DOUBLE TEST and its comparison</strong> — once the squeeze is done with two cans and then with one, a panel shows both TAs and their <strong>difference</strong>. That was the missing datum: the squeeze calibrates the needle's SENSITIVITY, but the TA correction is how much the same preclear reads differently with one can, and that cannot be deduced from a single test. Pressing <span class="tag">USE THIS OFFSET</span> brings the solo TA back to two cans and the margin disappears. A gap beyond 3 divisions is refused: that is not a configuration, it is a badly taken reading.`,
            `<strong>Why the "two cans or one" question</strong> — with TWO the current runs from hand to hand and the resistance is the preclear's: that is the reference. With ONE the circuit closes otherwise and the resistance is higher: the same preclear, at the same instant, gives a different TA.`,
            `The TA shown is <strong>always brought back to two cans</strong>, and under the number it says how: <em>TA · 2 cans</em> (the reference), <em>TA · 1 can → 2</em> (measured offset, applied), or <em>TA · 1 can − 1 division</em> — in amber, because the offset was not measured and the division has been <strong>actually taken off</strong>: a 4 becomes 3.<br><strong>The tone scale is calibrated on THIS number</strong>, not on the raw TA: otherwise, with a single can, the whole scale is off by one division.`,
            `<strong>No meter, no TONE ARM.</strong> The number reconstructed from the EEG is no longer shown: it looked like a measurement and was not one.`]}),
    H4({fr:"Le test reste en mémoire, pour CE préclear",it:"Il test resta in memoria, per QUESTO preclear",en:"The test is remembered, for THIS preclear"}),
    P({fr:`Ce sont les <strong>deux boîtes</strong> qui font foi. Le test de pression est archivé <strong>par personne</strong> — pas par appareil : la même pression sur le même mètre ne donne pas le même nombre d'une main à l'autre. Vous le retrouvez sur sa fiche dans <span class="tag">SÉANCE</span> → <span class="tag">AUDITEUR &amp; PC</span>, section <strong>PRÉCLAIRS</strong> : quand il a été fait, combien de fois, et l'écart mesuré pour le <strong>SOLO</strong> (une seule boîte). Avec plusieurs tests c'est la <strong>médiane</strong> qui compte — un essai raté ne déplace pas la mesure.`,
        it:`Sono le <strong>due lattine</strong> a fare fede. La prova della stretta si archivia <strong>per persona</strong> — non per apparecchio: la stessa stretta sullo stesso meter non dà lo stesso numero da una mano all'altra. La ritrovi sulla sua scheda in <span class="tag">SESSIONE</span> → <span class="tag">AUDITOR &amp; PC</span>, sezione <strong>PRECLEAR</strong>: quando è stata fatta, quante volte, e lo scarto misurato per il <strong>SOLO</strong> (una lattina sola). Con più prove conta la <strong>mediana</strong> — una prova andata male non sposta la misura.`,
        en:`The <strong>two cans</strong> are the reference. The squeeze test is stored <strong>per person</strong> — not per device: the same squeeze on the same meter does not give the same number from one hand to another. You find it on their card in <span class="tag">SESSION</span> → <span class="tag">AUDITOR &amp; PC</span>, <strong>PRECLEARS</strong> section: when it was done, how many times, and the measured offset for <strong>SOLO</strong> (a single can). With several tests the <strong>median</strong> counts — a botched try does not move the measure.`}),
    NOTE("warn",UI.L_note,{fr:`<strong>Sans test du jour, une division en moins.</strong> Si la pression n'a pas été faite aujourd'hui avec les deux boîtes, la sensibilité est celle de repli et le ton qui en sort est plus incertain qu'il n'en a l'air : le programme retire <strong>une division</strong> à l'échelle des tons — et il l'ÉCRIT <strong>sous le TONE ARM</strong>, en ambre : <em>−1 · fais le test des boîtes</em>. C'est un BOUTON : appuyez dessus et l'écran des tests se rouvre, en séance comme avant. Une correction que personne ne voit serait pire que pas de correction du tout.<br>⚠️ Cela ne vaut qu'<strong>avec le mètre branché</strong> : sans lui le ton n'est pas mesuré, c'est l'auditeur qui le déclare, et retirer une division à son jugement corrigerait une chose qui n'est pas une mesure.`,
        it:`<strong>Senza prova del giorno, una divisione in meno.</strong> Se la stretta non è stata fatta oggi con le due lattine, la sensibilità è quella di ripiego e il tono che ne esce è più incerto di quanto sembri: il programma toglie <strong>una divisione</strong> alla scala del tono — e lo SCRIVE <strong>sotto il TONE ARM</strong>, in ambra: <em>−1 · fai la prova delle lattine</em>. È un BOTTONE: premendolo la schermata delle prove si riapre, anche a seduta avviata. Una correzione che nessuno vede sarebbe peggio di nessuna correzione.<br>⚠️ Vale solo <strong>col meter collegato</strong>: senza, il tono non è misurato, lo dichiara l'auditor, e togliere una divisione al suo giudizio correggerebbe una cosa che non è una misura.`,
        en:`<strong>No test today, one division less.</strong> If the squeeze was not done today with the two cans, the sensitivity is the fallback one and the resulting tone is less certain than it looks: the program takes <strong>one division</strong> off the tone scale — and it SAYS so <strong>under the TONE ARM</strong>, in amber: <em>−1 · do the cans test</em>. It is a BUTTON: press it and the tests screen reopens, mid-session too. A correction nobody sees would be worse than no correction.<br>⚠️ This only applies <strong>with the meter connected</strong>: without it the tone is not measured, the auditor declares it, and taking a division off their judgement would correct something that is not a measurement.`}),
    H4({fr:"Si le TA vous paraît faux",it:"Se il TA ti sembra sbagliato",en:"If the TA looks wrong"}),
    P({fr:`L'échelle livrée avec le programme est déjà taraudée : en principe vous n'avez rien à faire. Si le nombre ne correspond pas à ce qu'affiche votre Theta-Meter, ouvrez <span class="tag">TRIM</span> → <strong>BOÎTES</strong> → <strong>TA — affiner l'échelle</strong> et inscrivez ce que le Theta-Meter montre au même instant. Recommencez à deux ou trois endroits de l'échelle (par exemple vers 2, vers 3,5, vers 5).`,
        it:`La scala fornita col programma è già tarata: in linea di principio non devi fare niente. Se il numero non corrisponde a quello del tuo Theta-Meter, apri <span class="tag">TRIM</span> → <strong>BOÎTES</strong> → <strong>TA — affina la scala</strong> e scrivi quello che il Theta-Meter mostra nello stesso istante. Ripeti in due o tre punti della scala (per esempio verso 2, verso 3,5, verso 5).`,
        en:`The scale shipped with the program is already calibrated: normally you need do nothing. If the number does not match your Theta-Meter's, open <span class="tag">TRIM</span> → <strong>CANS</strong> → <strong>TA — refine the scale</strong> and type what the Theta-Meter shows at that same moment. Repeat at two or three points of the scale (say around 2, around 3.5, around 5).`}),
    NOTE("ok",UI.L_ok,{fr:`L'<strong>E-METER TESTER</strong>, dans le même tiroir, ne sert que si vous possédez l'<strong>artefact physique</strong> (le boîtier à quatre boutons qui se branche à la place des boîtes). Sinon, ignorez-le.`,
        it:`L'<strong>E-METER TESTER</strong>, nello stesso cassetto, serve solo se possiedi l'<strong>artefatto fisico</strong> (la scatoletta a quattro bottoni che si attacca al posto delle boîtes). Altrimenti ignoralo.`,
        en:`The <strong>E-METER TESTER</strong>, in the same drawer, is only useful if you own the <strong>physical artifact</strong> (the four-button box that plugs in place of the cans). Otherwise ignore it.`}),
    H4({fr:"Le préclear a bougé",it:"Il preclear si è mosso",en:"The preclear moved"}),
    P({fr:`Un corps qui remue, une main qui resserre les boîtes : l'aiguille part sans que ce soit de la charge. L'app le reconnaît, <strong>suspend le Total TA</strong> quelques secondes et n'inscrit pas la lecture. Rien à faire : demandez simplement au préclear de tenir les boîtes sans les serrer.`,
        it:`Un corpo che si muove, una mano che stringe le boîtes: l'ago parte senza che sia carica. L'app lo riconosce, <strong>sospende il Total TA</strong> per qualche secondo e non scrive la lettura. Niente da fare: chiedi solo al preclear di tenere le boîtes senza stringerle.`,
        en:`A body that moves, a hand tightening on the cans: the needle swings without it being charge. The app spots it, <strong>suspends Total TA</strong> for a few seconds and does not record the read. Nothing to do: just ask the preclear to hold the cans without squeezing.`}),
    NOTE("info",UI.L_info,{fr:`Quand une lecture a déjà été écrite et que l'agitation arrive juste après, elle est <strong>retirée</strong> — une ligne orange le dit au journal. Mais seulement si c'est bien l'aiguille du <strong>METER</strong> qui est affichée : avec le MUSE devant, vous ne mesurez pas la résistance, et cette ligne semblerait parler de la réaction du MUSE. Elle reste dans l'archive, où elle sert à l'analyse.`,
        it:`Quando una lettura è già stata scritta e l'agitazione arriva subito dopo, viene <strong>ritirata</strong> — una riga arancione lo dice nel journal. Ma solo se sullo schermo c'è davvero l'ago del <strong>METER</strong>: col MUSE davanti non stai misurando la resistenza, e quella riga sembrerebbe parlare della reazione del MUSE. Resta nell'archivio, dove serve all'analisi.`,
        en:`When a read has already been written and the agitation arrives right after, it is <strong>withdrawn</strong> — an orange line says so in the journal. But only if the <strong>METER</strong> needle is the one displayed: with the MUSE on screen you are not measuring resistance, and that line would look like it referred to the MUSE's reaction. It stays in the archive, where it serves the analysis.`}),
    NOTE("warn",UI.L_warn,{fr:`La lecture qui compte est l'<strong>instant read</strong> : à la <strong>fin exacte du mot</strong>. Une réaction qui arrive une seconde plus tard est <strong>latente</strong> et ne vaut pas — l'app ne l'attribue pas à l'item, et c'est voulu.`,
        it:`La lettura che conta è l'<strong>instant read</strong>: alla <strong>fine esatta della parola</strong>. Una reazione che arriva un secondo dopo è <strong>latente</strong> e non vale — l'app non la attribuisce all'item, ed è voluto.`,
        en:`The read that counts is the <strong>instant read</strong>: at the <strong>exact end of the word</strong>. A reaction arriving a second later is <strong>latent</strong> and does not count — the app does not attribute it to the item, and that is deliberate.`}),
    H4({fr:"La F/N sur l'aiguille réelle — tarée sur la vidéo",it:"L'F/N sull'ago vero — tarata sul video",en:"The F/N on the real needle — calibrated on video"}),
    P({fr:`Une F/N n'est pas une amplitude : c'est une <strong>forme dans le temps</strong> — l'aiguille balaie, librement, rythmiquement, autour d'un même point. Le détecteur la reconnaît à quatre conditions, toutes nécessaires : des <strong>inversions</strong> répétées, une <strong>amplitude</strong> suffisante et semblable d'un balayage à l'autre, un <strong>rythme</strong> régulier, et un <strong>centre stable</strong>.`,
        it:`Un F/N non è un'ampiezza: è una <strong>forma nel tempo</strong> — l'ago spazza, libero, ritmicamente, attorno a uno stesso punto. Il rilevatore lo riconosce da quattro condizioni, tutte necessarie: <strong>inversioni</strong> ripetute, <strong>ampiezza</strong> sufficiente e simile fra una spazzata e l'altra, <strong>ritmo</strong> regolare, e <strong>centro stabile</strong>.`,
        en:`An F/N is not an amplitude: it is a <strong>shape in time</strong> — the needle sweeps, freely, rhythmically, around one point. The detector recognises it by four conditions, all necessary: repeated <strong>reversals</strong>, an <strong>amplitude</strong> sufficient and similar from sweep to sweep, a regular <strong>rhythm</strong>, and a <strong>stable centre</strong>.`}),
    NOTE("warn",UI.L_warn,{fr:`<strong>Ces seuils ont été faux, et le détecteur était aveugle.</strong> En quatorze séances il n'avait produit que <strong>2</strong> F/N contre 95 pour le MUSE — ce qui ressemblait à de la sévérité était une panne. Nous avons suivi image par image les <strong>quatre types de F/N</strong> filmés sur un vrai cadran (Floating Needle, Persistent, Instant, Floating Tone Arm) : le détecteur n'en voyait <strong>aucun</strong>. Deux causes de structure — une F/N lente ne pouvait pas tenir dans la fenêtre d'analyse, et les à-coups de l'aiguille au bord du cadran étaient comptés comme des balayages, puis faisaient échouer le minimum d'amplitude.`,
        it:`<strong>Queste soglie erano sbagliate, e il rilevatore era cieco.</strong> In quattordici sedute aveva prodotto <strong>2</strong> F/N contro i 95 del MUSE — quella che sembrava severità era un guasto. Abbiamo inseguito immagine per immagine i <strong>quattro tipi di F/N</strong> ripresi da un quadrante vero (Floating Needle, Persistent, Instant, Floating Tone Arm): il rilevatore non ne vedeva <strong>nessuno</strong>. Due cause di struttura — un F/N lento non poteva stare nella finestra d'analisi, e i sussulti dell'ago al bordo del quadrante venivano contati come spazzate, e poi facevano fallire il minimo di ampiezza.`,
        en:`<strong>These thresholds were wrong, and the detector was blind.</strong> In fourteen sessions it had produced <strong>2</strong> F/N against the MUSE's 95 — what looked like strictness was a failure. We tracked, frame by frame, the <strong>four F/N types</strong> filmed on a real dial (Floating Needle, Persistent, Instant, Floating Tone Arm): the detector saw <strong>none</strong> of them. Two structural causes — a slow F/N could not fit inside the analysis window, and the needle's small jerks at the dial edge were counted as sweeps, then made the minimum amplitude fail.`}),
    P({fr:`Après le taraudage, les <strong>quatre</strong> sont reconnus, et les contrôles négatifs (aiguille immobile, bruit, une chute, la dérive lente du bras) ne produisent toujours rien. Sur la première séance réelle qui a suivi : <strong>46</strong> F/N sur l'aiguille des boîtes, dont 7 en accord avec le MUSE.`,
        it:`Dopo la taratura, <strong>tutti e quattro</strong> vengono riconosciuti, e i controlli negativi (ago fermo, rumore, una caduta, la deriva lenta del braccio) continuano a non produrre niente. Sulla prima seduta vera successiva: <strong>46</strong> F/N sull'ago delle boîtes, di cui 7 in accordo col MUSE.`,
        en:`After calibration, <strong>all four</strong> are recognised, and the negative controls (still needle, noise, a fall, the arm's slow drift) still produce nothing. On the first real session that followed: <strong>46</strong> F/N on the cans' needle, 7 of them agreeing with the MUSE.`})]},
/* ───────────────────────── CHOIX DE L'INSTRUMENT ───────────────────────── */
{ id:"m-instruments", grp:"core", t:{fr:"BRANCHER UN INSTRUMENT — les trois configurations",it:"COLLEGA UNO STRUMENTO — le tre configurazioni",en:"CONNECT AN INSTRUMENT — the three configurations"},
  role:[
    P({fr:`On peut auditer avec le <strong>MUSE 2 seul</strong>, avec le <strong>THETA-METER seul</strong>, ou avec <strong>les deux</strong>. Ce n'est pas un manque à réparer : c'est une configuration choisie, et l'app s'y adapte au lieu de réclamer ce qui n'est pas là.`,
        it:`Si può auditare col <strong>MUSE 2 solo</strong>, col <strong>THETA-METER solo</strong>, o con <strong>tutti e due</strong>. Non è una mancanza da rimediare: è una configurazione scelta, e l'app si adatta invece di reclamare quello che non c'è.`,
        en:`You can audit with the <strong>MUSE 2 alone</strong>, the <strong>THETA-METER alone</strong>, or <strong>both</strong>. This is not a lack to be fixed: it is a chosen configuration, and the app adapts instead of demanding what is not there.`}),
    SHOT("instruments-panneau.png",{fr:"Le panneau de choix de l'instrument",it:"Il pannello di scelta dello strumento",en:"The instrument chooser panel"})],
  on:[ P({fr:`Le panneau s'ouvre au <span class="tag en">START</span> quand rien n'est encore branché. Cliquez l'un, l'autre, ou <strong>les deux</strong> avant de lancer la connexion. Les badges en haut à gauche font la même chose à tout moment.`,
        it:`Il pannello si apre allo <span class="tag en">START</span> quando non c'è ancora niente collegato. Clicca l'uno, l'altro, o <strong>tutti e due</strong> prima di avviare la connessione. I badge in alto a sinistra fanno la stessa cosa in qualsiasi momento.`,
        en:`The panel opens on <span class="tag en">START</span> when nothing is connected yet. Click one, the other, or <strong>both</strong> before launching the connection. The badges at top left do the same thing at any time.`})],
  off:[ P({fr:`Un instrument cliqué par erreur se <strong>déselectionne</strong> du même clic — on n'est jamais coincé.`,
        it:`Uno strumento cliccato per errore si <strong>deseleziona</strong> con lo stesso clic — non si resta mai bloccati.`,
        en:`An instrument clicked by mistake <strong>deselects</strong> with the same click — you are never stuck.`})],
  in:[
    H4({fr:"Ce qui se montre et ce qui se cache",it:"Cosa si mostra e cosa si nasconde",en:"What shows and what hides"}),
    P({fr:`Réglez <span class="tag">CONFIG</span> une fois pour toutes : ce qui n'a pas de source se masque tout seul, et <strong>revient dès que vous branchez l'instrument</strong>. Vous n'avez pas à refaire vos réglages en changeant de configuration.`,
        it:`Regola <span class="tag">CONFIG</span> una volta per tutte: ciò che non ha sorgente si nasconde da sé, e <strong>torna appena colleghi lo strumento</strong>. Non devi rifare le impostazioni quando cambi configurazione.`,
        en:`Set <span class="tag">CONFIG</span> once and for all: whatever has no source hides itself, and <strong>comes back as soon as you connect the instrument</strong>. You never have to redo your settings when you change configuration.`}),
    TABLE({fr:["Configuration","Ce qui disparaît"],it:["Configurazione","Cosa scompare"],en:["Configuration","What disappears"]},[
      {fr:["MUSE 2 seul","Rien — tout est disponible"],it:["MUSE 2 solo","Niente — tutto è disponibile"],en:["MUSE 2 alone","Nothing — everything is available"]},
      {fr:["THETA-METER seul","Santé système, Intégrité biométrique, MNA, l'aiguille du MUSE, les cycles CONTACT / NULL, la barre de question, RELEASE SPEED"],it:["THETA-METER solo","Salute sistema, Integrità biometrica, MNA, l'ago del MUSE, i cicli CONTACT / NULL, la barra della domanda, RELEASE SPEED"],en:["THETA-METER alone","System health, Biometric integrity, MNA, the MUSE needle, the CONTACT / NULL cycles, the question bar, RELEASE SPEED"]},
      {fr:["Les deux","Rien — les deux aiguilles sont sur le cadran"],it:["Tutti e due","Niente — i due aghi sono sul quadrante"],en:["Both","Nothing — both needles are on the dial"]}]),
    NOTE("note",UI.L_note,{fr:`Les cycles CONTACT et NULL se cachent avec le seul METER parce qu'ils reposent sur la <strong>charge mesurée par l'EEG</strong> : sans le MUSE, il n'y a rien qui puisse les faire avancer. L'ASSESSMENT, lui, marche parfaitement avec les seules boîtes — c'est la façon classique.`,
        it:`I cicli CONTACT e NULL si nascondono col solo METER perché si reggono sulla <strong>carica misurata dall'EEG</strong>: senza il MUSE non c'è nulla che possa farli avanzare. L'ASSESSMENT invece funziona benissimo con le sole boîtes — è il modo classico.`,
        en:`The CONTACT and NULL cycles hide with the meter alone because they rest on the <strong>charge measured by the EEG</strong>: without the MUSE there is nothing to move them along. ASSESSMENT, on the other hand, works perfectly with the cans alone — that is the classic way.`}),
    P({fr:`Chaque aiguille n'apparaît que si <strong>sa</strong> source est là : pas d'aiguille MUSE sans MUSE, pas d'aiguille METER sans METER. Celle des boîtes se termine par une <strong>flèche</strong> comme celle du MUSE, dans sa couleur ambre.`,
        it:`Ogni ago appare solo se <strong>la sua</strong> sorgente c'è: nessun ago MUSE senza MUSE, nessun ago METER senza METER. Quello delle boîtes termina con una <strong>freccia</strong> come quello del MUSE, nel suo colore ambra.`,
        en:`Each needle appears only if <strong>its</strong> source is present: no MUSE needle without the MUSE, no METER needle without the METER. The cans' needle ends in an <strong>arrowhead</strong> like the MUSE one, in its amber colour.`})]},

/* ───────────────────────── SESSION / MODES ───────────────────────── */
{ id:"m-session", grp:"core", t:{fr:"Modes de séance (local, à distance, solo)",it:"Modi di seduta (locale, a distanza, solo)",en:"Session modes (local, remote, solo)"},
  role:[
    P({fr:`Définit <strong>qui porte le casque</strong> et <strong>où</strong> se trouvent l'auditeur et le préclear.`,
        it:`Definisce <strong>chi indossa il casco</strong> e <strong>dove</strong> si trovano auditor e preclear.`,
        en:`Defines <strong>who wears the headset</strong> and <strong>where</strong> the auditor and preclear are.`}),
    TABLE({fr:["Mode","Situation"],it:["Modo","Situazione"],en:["Mode","Situation"]},[
      {fr:["LOCAL","Auditeur et PC dans la même pièce, un seul ordinateur, le casque y est connecté."],it:["LOCAL","Auditor e PC nella stessa stanza, un solo computer, il casco è connesso lì."],en:["LOCAL","Auditor and PC in the same room, one computer, the headset connects to it."]},
      {fr:["AUDITOR","Séance <strong>à distance</strong> — vous êtes l'auditeur. Le PC porte le casque chez lui et vous envoie son signal."],it:["AUDITOR","Seduta <strong>a distanza</strong> — tu sei l'auditor. Il PC indossa il casco a casa sua e ti invia il segnale."],en:["AUDITOR","<strong>Remote</strong> session — you are the auditor. The PC wears the headset at home and streams to you."]},
      {fr:["PRECLEAR","Séance à distance — vous êtes le préclear : vous portez le casque et votre appareil transmet à l'auditeur."],it:["PRECLEAR","Seduta a distanza — sei il preclear: indossi il casco e il tuo apparecchio trasmette all'auditor."],en:["PRECLEAR","Remote session — you are the preclear: you wear the headset and your device streams to the auditor."]},
      {fr:["SOLO","Vous êtes seul : auditeur et PC à la fois. C'est un réglage de la séance, pas un mode réseau."],it:["SOLO","Sei da solo: auditor e PC insieme. È un'impostazione della seduta, non un modo di rete."],en:["SOLO","You are alone: auditor and PC at once. A session setting, not a network mode."]}]),
    SHOT("session-modes.png",{fr:"Le choix du mode de séance",it:"La scelta del modo di seduta",en:"Choosing the session mode"})],
  on:[ P({fr:`Le mode se choisit au démarrage, avant la connexion. En séance à distance, un lien de connexion relie les deux appareils.`,
        it:`Il modo si sceglie all'avvio, prima della connessione. In seduta a distanza un link di connessione unisce i due apparecchi.`,
        en:`The mode is chosen at start-up, before connecting. For remote sessions a connection link joins the two devices.`}),
    SHOT("session-lien.png",{fr:"Le lien de connexion à distance",it:"Il link di connessione a distanza",en:"The remote connection link"})],
  off:[ P({fr:`Le mode reste actif toute la séance ; on en change en revenant à l'écran de départ.`,it:`Il modo resta attivo per tutta la seduta; si cambia tornando alla schermata iniziale.`,en:`The mode stays active for the whole session; change it by returning to the start screen.`})],
  in:[ P({fr:`À distance, les deux appareils se parlent <strong>directement</strong> (pair-à-pair) : signal du casque, vidéo, voix et état de la séance. Le préclear voit son propre écran « miroir » piloté par l'auditeur. Si le lien se coupe, la séance est mise en pause et les données déjà enregistrées sont conservées.`,
        it:`A distanza i due apparecchi si parlano <strong>direttamente</strong> (peer-to-peer): segnale del casco, video, voce e stato della seduta. Il preclear vede il proprio schermo « specchio » pilotato dall'auditor. Se il collegamento cade, la seduta va in pausa e i dati già registrati sono conservati.`,
        en:`Remotely, the two devices talk <strong>directly</strong> (peer-to-peer): headset signal, video, voice and session state. The preclear sees their own "mirror" screen driven by the auditor. If the link drops, the session pauses and data already recorded is preserved.`}),
    NOTE("warn",UI.L_warn,{fr:`Le <strong>MUSE voyage, les boîtes non</strong>. Le signal du casque passe dans le lien ; le THETA-METER est branché en USB sur <em>votre</em> machine et ne mesure que celui qui en tient les boîtes. En séance vraiment à distance le meter n'est donc pas proposé — s'il l'était, son aiguille bougerait sans mesurer personne. Il redevient disponible dès que le préclair est <strong>dans la même pièce</strong> (téléphone-satellite : le téléphone ne sert alors que de caméra et micro).`,it:`Il <strong>MUSE viaggia, le lattine no</strong>. Il segnale del casco passa nel link; il THETA-METER è collegato in USB alla <em>tua</em> macchina e misura solo chi ne tiene le lattine. In seduta davvero a distanza il meter non viene quindi proposto — se lo fosse, il suo ago si muoverebbe senza misurare nessuno. Torna disponibile appena il preclear è <strong>nella stessa stanza</strong> (telefono-satellite: il telefono fa allora solo da camera e microfono).`,en:`The <strong>MUSE travels, the cans do not</strong>. The headset signal goes through the link; the THETA-METER is plugged by USB into <em>your</em> machine and only measures whoever holds its cans. In a truly remote session the meter is therefore not offered — were it offered, its needle would move while measuring nobody. It comes back as soon as the preclear is <strong>in the same room</strong> (phone-satellite: the phone then serves only as camera and microphone).`}),
    SHOT("session-distance.png",{fr:"Séance à distance : les deux écrans",it:"Seduta a distanza: i due schermi",en:"Remote session: the two screens"})]},

{ id:"m-satellite", grp:"core", t:{fr:"Téléphone-satellite — le PC est dans la même pièce",it:"Telefono-satellite — il PC è nella stessa stanza",en:"Phone-satellite — the PC is in the same room"},
  role:[
    P({fr:`Une <strong>troisième</strong> situation, entre le local et la distance : l'auditeur et le préclair sont <strong>dans la même pièce</strong>, sur un seul Mac — mais le <strong>téléphone du préclair</strong> rejoint la séance et devient sa caméra rapprochée et son microphone.`,
        it:`Una <strong>terza</strong> situazione, fra il locale e la distanza: auditor e preclear sono <strong>nella stessa stanza</strong>, su un solo Mac — ma il <strong>telefono del preclear</strong> entra nella seduta e ne diventa la camera ravvicinata e il microfono.`,
        en:`A <strong>third</strong> situation, between local and remote: auditor and preclear are <strong>in the same room</strong>, on one Mac — but the <strong>preclear's phone</strong> joins the session and becomes their close-up camera and microphone.`}),
    P({fr:`Ce n'est pas une séance à distance : rien du signal ne voyage. Seuls la voix et l'image du préclair arrivent du téléphone.`,
        it:`Non è una seduta a distanza: nulla del segnale viaggia. Dal telefono arrivano soltanto la voce e l'immagine del preclear.`,
        en:`It is not a remote session: none of the signal travels. Only the preclear's voice and image come from the phone.`}),
    TABLE({fr:["Ce qui est où","Où"],it:["Cosa sta dove","Dove"],en:["What is where","Where"]},[
      {fr:["MUSE 2","Appairé <strong>directement au Mac</strong>, pas au téléphone — l'aiguille n'a aucune latence de réseau."],it:["MUSE 2","Appaiato <strong>direttamente al Mac</strong>, non al telefono — l'ago non ha nessuna latenza di rete."],en:["MUSE 2","Paired <strong>directly to the Mac</strong>, not the phone — the needle has no network latency."]},
      {fr:["THETA-METER","En USB sur le Mac, les boîtes dans les mains du préclair : il marche exactement comme en local."],it:["THETA-METER","In USB sul Mac, le lattine nelle mani del preclear: funziona esattamente come in locale."],en:["THETA-METER","USB on the Mac, the cans in the preclear's hands: it works exactly as in local."]},
      {fr:["Téléphone du PC","Caméra (le visage de près) et micro (sa voix de près). Rien d'autre."],it:["Telefono del PC","Camera (il viso da vicino) e microfono (la sua voce da vicino). Nient'altro."],en:["PC's phone","Camera (the face close up) and mic (their voice close up). Nothing else."]},
      {fr:["Séance, cadran, journal","Sur le Mac, comme en local."],it:["Seduta, quadrante, journal","Sul Mac, come in locale."],en:["Session, dial, journal","On the Mac, as in local."]}])],
  on:[ P({fr:`Dans le tiroir <strong>SÉANCE</strong>, en mode <span class="tag en">LOCAL</span> et hors solo, appuyez sur <strong>📱 Téléphone comme caméra &amp; micro</strong>. Une fenêtre s'ouvre avec un <strong>QR code</strong> : le préclair le scanne avec l'appareil photo de son téléphone, touche <span class="tag en">CONNECTER</span> et autorise le micro et la caméra.`,
        it:`Nel cassetto <strong>SEDUTA</strong>, in modo <span class="tag en">LOCAL</span> e fuori dal solo, premi <strong>📱 Telefono come cam e microfono</strong>. Si apre una finestra con un <strong>QR code</strong>: il preclear lo scansiona con la fotocamera del telefono, tocca <span class="tag en">CONNETTI</span> e autorizza microfono e camera.`,
        en:`In the <strong>SESSION</strong> drawer, in <span class="tag en">LOCAL</span> mode and not solo, press <strong>📱 Use phone as camera &amp; mic</strong>. A window opens with a <strong>QR code</strong>: the preclear scans it with their phone camera, taps <span class="tag en">CONNECT</span> and allows mic and camera.`}),
    NOTE("note",UI.L_note,{fr:`L'interface continue d'afficher <span class="tag en">LOCAL</span>, et c'est voulu : c'est bien une séance en présentiel. C'est un téléphone qui a rejoint, pas un préclair distant.`,
        it:`L'interfaccia continua a mostrare <span class="tag en">LOCAL</span>, ed è voluto: è una seduta in presenza. È un telefono che si è unito, non un preclear a distanza.`,
        en:`The interface keeps showing <span class="tag en">LOCAL</span>, and that is deliberate: it is an in-person session. A phone joined, not a remote preclear.`}),
    SHOT("satellite-qr.png",{fr:"Le QR à scanner avec le téléphone du préclair",it:"Il QR da scansionare col telefono del preclear",en:"The QR to scan with the preclear's phone"})],
  off:[ P({fr:`Revenez avec <strong>← LOCAL</strong> dans le tiroir SÉANCE. Fermer la fenêtre <em>avant</em> que le téléphone ne se soit connecté annule aussi : on repart en local simple.`,
        it:`Torna con <strong>← LOCAL</strong> nel cassetto SEDUTA. Anche chiudere la finestra <em>prima</em> che il telefono si sia connesso annulla: si riparte in locale semplice.`,
        en:`Come back with <strong>← LOCAL</strong> in the SESSION drawer. Closing the window <em>before</em> the phone has connected also cancels: you return to plain local.`})],
  in:[
    P({fr:`Les instruments marchent comme en local : le MUSE <strong>et</strong> les boîtes sont tous les deux disponibles, et les deux épreuves des boîtes (le serrement, le souffle) se font normalement. C'est la différence avec la séance à distance, où les boîtes ne sont pas proposées.`,
        it:`Gli strumenti funzionano come in locale: il MUSE <strong>e</strong> le lattine sono tutti e due disponibili, e le due prove delle lattine (la stretta, il soffio) si fanno normalmente. È la differenza con la seduta a distanza, dove le lattine non vengono proposte.`,
        en:`The instruments work as in local: the MUSE <strong>and</strong> the cans are both available, and the two cans tests (the squeeze, the breath) are done normally. That is the difference from the remote session, where the cans are not offered.`}),
    NOTE("warn",UI.L_warn,{fr:`Sur le téléphone, le bouton de connexion du MUSE est <strong>masqué</strong> et remplacé par « MUSE sur le Mac ». N'appairez pas le casque au téléphone : un second appairage Bluetooth le <strong>volerait</strong> au Mac, et l'aiguille s'arrêterait.`,
        it:`Sul telefono il pulsante di connessione del MUSE è <strong>nascosto</strong> e sostituito da « MUSE sul Mac ». Non appaiare il casco al telefono: un secondo accoppiamento Bluetooth lo <strong>ruberebbe</strong> al Mac, e l'ago si fermerebbe.`,
        en:`On the phone the MUSE connect button is <strong>hidden</strong> and replaced by "MUSE on the Mac". Do not pair the headset to the phone: a second Bluetooth pairing would <strong>steal</strong> it from the Mac, and the needle would stop.`}),
    P({fr:`Le Mac n'envoie <strong>ni son ni image</strong> vers le téléphone. Dans la même pièce, deux haut-parleurs et deux micros ouverts siffleraient (effet Larsen) : la liaison ne va donc que dans un sens.`,
        it:`Il Mac non manda <strong>né suono né immagine</strong> verso il telefono. Nella stessa stanza due altoparlanti e due microfoni aperti fischierebbero (effetto Larsen): il collegamento va quindi in un senso solo.`,
        en:`The Mac sends <strong>neither sound nor image</strong> to the phone. In the same room, two speakers and two open mics would howl (feedback): the link therefore goes one way only.`}),
    P({fr:`La voix du préclair est captée <strong>deux fois</strong> : nettement par son téléphone (micro de près), et faiblement par le micro du Mac, qui pourrait l'écrire au journal sous l'étiquette « Auditeur ». L'app supprime le doublon — d'abord en comparant les <strong>textes</strong>, puis, en cas de doute, l'<strong>énergie</strong> des deux micros : le téléphone est près du préclair, le Mac près de l'auditeur, et c'est ce qui les distingue. Le doublon n'est jamais supprimé sur la seule énergie : parler en même temps ne doit pas effacer une phrase de l'auditeur.`,
        it:`La voce del preclear è catturata <strong>due volte</strong>: nitida dal suo telefono (microfono da vicino), e debole dal microfono del Mac, che potrebbe scriverla nel journal con l'etichetta « Auditor ». L'app toglie il doppione — prima confrontando i <strong>testi</strong>, poi, in caso di dubbio, l'<strong>energia</strong> dei due microfoni: il telefono è vicino al preclear, il Mac vicino all'auditor, ed è questo che li distingue. Il doppione non viene mai tolto sulla sola energia: parlare insieme non deve cancellare una frase dell'auditor.`,
        en:`The preclear's voice is captured <strong>twice</strong>: clearly by their phone (close mic), and faintly by the Mac's own mic, which might write it into the journal labelled "Auditor". The app drops the duplicate — first by comparing the <strong>texts</strong>, then, when in doubt, the <strong>energy</strong> of the two mics: the phone is close to the preclear, the Mac close to the auditor, and that is what tells them apart. The duplicate is never dropped on energy alone: talking at the same time must not erase an auditor line.`})]},

/* ───────────────────────── VUES DU CADRAN ───────────────────────── */
{ id:"m-vues", grp:"dial", t:{fr:"Les trois vues du cadran",it:"Le tre viste del quadrante",en:"The three dial views"},
  role:[
    P({fr:`Un sélecteur unique, en haut à gauche, bascule entre trois façons de regarder la même aiguille.`,
        it:`Un selettore unico, in alto a sinistra, commuta tra tre modi di guardare lo stesso ago.`,
        en:`A single selector, top-left, switches between three ways of looking at the same needle.`}),
    TABLE({fr:["Vue","Ce qu'elle montre"],it:["Vista","Cosa mostra"],en:["View","What it shows"]},[
      {fr:["AGO","L'aiguille seule, épurée — rien qui distraie."],it:["AGO","Solo l'ago, essenziale — niente che distragga."],en:["AGO","The needle alone, clean — nothing distracting."]},
      {fr:["AGO +","L'aiguille avec sa traînée, les libellés de réaction et l'arc du cycle en cours."],it:["AGO +","L'ago con la scia, le etichette di reazione e l'arco del ciclo in corso."],en:["AGO +","The needle with its trail, reaction labels and the running cycle's arc."]},
      {fr:["MIRROR","L'échelle 1–10 de la méthode du double (voir plus bas)."],it:["MIRROR","La scala 1–10 del metodo del doppio (vedi sotto)."],en:["MIRROR","The 1–10 scale of the doubling method (see below)."]}]),
    NOTE("info",UI.L_note,{fr:`<strong>La couleur de la traînée dit l'ÉTAT DE LA CHARGE, pas la force de la lecture.</strong> <strong style="color:#ff5a5a">Rouge</strong> = CONTACT (charge présente) · <strong style="color:#37e0ff">cyan</strong> = DISSOLUTION (relâchement en cours) · <strong>blanc-cyan</strong> = AS-IS (la signature a disparu). Dégradé du clair (au SET) au foncé (à la pointe), dans la même teinte.|De la lecture, la traînée dit l'ÉPAISSEUR et le halo : plus la chute est longue, plus la traînée est large. La couleur ne revient dépendre de la position de l'aiguille (cyan → jaune → rouge) que lorsqu'il n'y a <em>aucune</em> charge en cours.|Vaut aussi en <strong>MIRROR</strong>, qui affiche la même traînée.`,
        it:`<strong>Il colore della scia dice lo STATO DELLA CARICA, non la forza della lettura.</strong> <strong style="color:#ff5a5a">Rosso</strong> = CONTACT (carica presente) · <strong style="color:#37e0ff">ciano</strong> = DISSOLUZIONE (rilascio in corso) · <strong>bianco-ciano</strong> = AS-IS (la firma è sparita). Sfuma dal chiaro (al SET) allo scuro (in punta), nella stessa tinta.|Della lettura la scia dice lo SPESSORE e l'alone: più lunga è la caduta, più grossa è la scia. Il colore torna a dipendere dalla posizione dell'ago (ciano → giallo → rosso) soltanto quando non c'è <em>nessuna</em> carica in corso.|Vale anche in <strong>MIRROR</strong>, che mostra la stessa scia.`,
        en:`<strong>The trail's colour says the CHARGE STATE, not the strength of the read.</strong> <strong style="color:#ff5a5a">Red</strong> = CONTACT (charge present) · <strong style="color:#37e0ff">cyan</strong> = DISSOLUTION (release under way) · <strong>white-cyan</strong> = AS-IS (the signature is gone). It shades from light (at SET) to dark (at the tip), in the same hue.|What the trail says about the read is its THICKNESS and glow: the longer the fall, the wider the trail. The colour only goes back to depending on needle position (cyan → yellow → red) when there is <em>no</em> charge under way at all.|Also true in <strong>MIRROR</strong>, which shows the same trail.`}),
    SHOT("vues-selecteur.png",{fr:"Le sélecteur AGO / AGO + / MIRROR",it:"Il selettore AGO / AGO + / MIRROR",en:"The AGO / AGO + / MIRROR selector"},1)],
  on:[ P({fr:`Cliquez simplement sur le nom de la vue voulue.`,it:`Basta cliccare sul nome della vista desiderata.`,en:`Just click the name of the view you want.`})],
  off:[ P({fr:`Le sélecteur reste toujours affiché : il faut pouvoir changer de vue à tout instant.`,it:`Il selettore resta sempre visibile: si deve poter cambiare vista in qualsiasi momento.`,en:`The selector is always shown: you must be able to switch views at any moment.`})],
  in:[ P({fr:`Les trois vues partagent <strong>la même aiguille</strong> et le même signal — seul l'habillage change. Passer de l'une à l'autre en pleine séance ne perturbe ni la mesure ni le cycle en cours.`,
        it:`Le tre viste condividono <strong>lo stesso ago</strong> e lo stesso segnale — cambia solo la veste. Passare dall'una all'altra in piena seduta non disturba né la misura né il ciclo in corso.`,
        en:`All three views share <strong>the same needle</strong> and the same signal — only the dressing changes. Switching mid-session disturbs neither the measurement nor the running cycle.`})]},

/* ───────────────────────── AIGUILLE / RÉACTIONS ───────────────────────── */
{ id:"m-aiguille", grp:"dial", t:{fr:"L'aiguille et ses réactions",it:"L'ago e le sue reazioni",en:"The needle and its reactions"},
  role:[
    P({fr:`L'aiguille est la lecture principale. Elle ne bouge que pour ce qui compte : les réactions fortes reçoivent une <strong>impulsion</strong>, la F/N laisse l'aiguille <strong>flotter</strong>, et tout le reste revient au repos.`,
        it:`L'ago è la lettura principale. Si muove solo per ciò che conta: le reazioni forti ricevono un <strong>colpo</strong>, la F/N lascia l'ago <strong>fluttuare</strong>, e tutto il resto torna a riposo.`,
        en:`The needle is the main read. It moves only for what matters: strong reactions get a <strong>kick</strong>, an F/N lets the needle <strong>float</strong>, and everything else returns to rest.`}),
    TABLE({fr:["Réaction","Ce que fait l'aiguille"],it:["Reazione","Cosa fa l'ago"],en:["Reaction","What the needle does"]},[
      {fr:["Set","Repos — aucune charge active."],it:["Set","Riposo — nessuna carica attiva."],en:["Set","Rest — no active charge."]},
      {fr:["Tick","Petite secousse."],it:["Tick","Piccola scossa."],en:["Tick","A tiny tick."]},
      {fr:["SF","Petite chute (Small Fall)."],it:["SF","Piccola caduta (Small Fall)."],en:["SF","Small Fall."]},
      {fr:["Fall","Chute nette vers la droite : de la charge est contactée."],it:["Fall","Caduta netta verso destra: viene contattata carica."],en:["Fall","A sharp fall to the right: charge is contacted."]},
      {fr:["Long Fall","Chute ample et prolongée."],it:["Long Fall","Caduta ampia e prolungata."],en:["Long Fall","A wide, sustained fall."]},
      {fr:["LF Blow Down","L'aiguille part jusqu'au bord du cadran."],it:["LF Blow Down","L'ago parte fino al bordo del quadrante."],en:["LF Blow Down","The needle drives to the edge of the dial."]},
      {fr:["Dirty Needle","Aiguille sale, agitée, irrégulière."],it:["Dirty Needle","Ago sporco, agitato, irregolare."],en:["Dirty Needle","A dirty, ragged, irregular needle."]},
      {fr:["F/N","Balayage rythmique, lent et régulier — l'aiguille flotte. C'est un aboutissement."],it:["F/N","Spazzata ritmica, lenta e regolare — l'ago fluttua. È un aboutissement."],en:["F/N","A rhythmic, slow, even sweep — the needle floats. This is an outcome."]}]),
    SHOT("aiguille-reactions.png",{fr:"Le libellé de réaction au-dessus de l'aiguille",it:"L'etichetta di reazione sopra l'ago",en:"The reaction label above the needle"})],
  on:[ P({fr:`Rien à activer : dès que la séance tourne et que le casque est porté, l'aiguille est vivante.`,it:`Niente da attivare: appena la seduta gira e il casco è indossato, l'ago è vivo.`,en:`Nothing to turn on: as soon as the session runs and the headset is worn, the needle is alive.`})],
  off:[ P({fr:`L'aiguille ne se masque pas — c'est l'instrument.`,it:`L'ago non si nasconde — è lo strumento.`,en:`The needle cannot be hidden — it is the instrument.`})],
  in:[
    NOTE("info",UI.L_note,{fr:`Une réaction est un <strong>changement</strong>, pas un état. Une F/N déjà en cours qui continue n'est pas une réaction à votre question : pour cet item, c'est <span class="tag en">NULL</span> (ago nullo).`,
        it:`Una reazione è un <strong>cambiamento</strong>, non uno stato. Una F/N già in corso che continua non è una reazione alla tua domanda: per quell'item è <span class="tag en">NULL</span> (ago nullo).`,
        en:`A read is a <strong>change</strong>, not a state. An F/N already running that keeps going is not a reaction to your question: for that item it is <span class="tag en">NULL</span>.`}),
    H4({fr:"Si le préclear bouge",it:"Se il preclear si muove",en:"If the preclear moves"}),
    P({fr:`Un mouvement de tête ou une mâchoire serrée ressemble à une chute. L'app l'écarte au lieu de l'inscrire — mais elle laisse passer les petits mouvements, parce que perdre une vraie lecture serait pire. <strong>Ce que vous avez à faire :</strong> demandez au préclear de rester tranquille, et si vous voyez une chute juste après qu'il a bougé, méfiez-vous d'elle avant de l'utiliser.`,
        it:`Un movimento della testa o una mandibola stretta somiglia a una caduta. L'app la scarta invece di scriverla — ma lascia passare i piccoli movimenti, perché perdere una lettura vera sarebbe peggio. <strong>Cosa devi fare:</strong> chiedi al preclear di stare tranquillo, e se vedi una caduta subito dopo che si è mosso, diffidane prima di usarla.`,
        en:`A head movement or a clenched jaw looks like a fall. The app discards it rather than recording it — but it lets small movements through, because losing a real read would be worse. <strong>What you have to do:</strong> ask the preclear to stay still, and if you see a fall right after they moved, distrust it before using it.`}),
    SHOT("aiguille-artefact.png",{fr:"Le gyroscope pendant un mouvement de tête",it:"Il giroscopio durante un movimento della testa",en:"The gyroscope during a head movement"}),
    H4({fr:"Deux instruments, UNE aiguille — et c'est vous qui choisissez",it:"Due strumenti, UN ago — e scegli tu",en:"Two instruments, ONE needle — and you choose"}),
    P({fr:`Avec le MUSE 2 <em>et</em> le THETA-METER branchés, un sélecteur <span class="tag">MUSE</span> / <span class="tag">METER</span> apparaît <strong>sous le pivot de l'aiguille</strong>. Une seule aiguille est dessinée : celle que vous avez choisie. L'autre instrument continue de mesurer et d'archiver — il cesse seulement de dessiner.`,
        it:`Col MUSE 2 <em>e</em> il THETA-METER collegati, sotto il <strong>perno dell'ago</strong> compare un selettore <span class="tag">MUSE</span> / <span class="tag">METER</span>. Si disegna un ago solo: quello che hai scelto. L'altro strumento continua a misurare e ad archiviare — smette soltanto di disegnare.`,
        en:`With the MUSE 2 <em>and</em> the THETA-METER connected, a <span class="tag">MUSE</span> / <span class="tag">METER</span> selector appears <strong>under the needle pivot</strong>. Only one needle is drawn: the one you chose. The other instrument keeps measuring and archiving — it merely stops drawing.`}),
    NOTE("warn",UI.L_warn,{fr:`<strong>La lecture des items suit l'aiguille affichée.</strong> Si le METER est à l'écran, un item ne prend que ce que le METER a fait — même si le MUSE, lui, a réagi. Ce n'est pas un défaut : rien ne s'inscrit que vous n'ayez pu voir. En pratique cela change beaucoup — sur nos séances le MUSE lit environ <strong>36 %</strong> des items et le METER <strong>8 %</strong>. Les deux lectures sont archivées séparément dans tous les cas.`,
        it:`<strong>La lettura degli item segue l'ago mostrato.</strong> Se sullo schermo c'è il METER, un item prende solo ciò che ha fatto il METER — anche se il MUSE ha reagito. Non è un difetto: non si scrive nulla che tu non abbia potuto vedere. In pratica cambia molto — sulle nostre sedute il MUSE legge circa il <strong>36 %</strong> degli item e il METER l'<strong>8 %</strong>. Le due letture restano comunque archiviate separatamente.`,
        en:`<strong>The item read follows the displayed needle.</strong> If the METER is on screen, an item takes only what the METER did — even if the MUSE reacted. This is not a fault: nothing is recorded that you could not have seen. In practice it changes a lot — across our sessions the MUSE reads about <strong>36 %</strong> of items and the METER <strong>8 %</strong>. Both reads are archived separately regardless.`}),
    P({fr:`<strong>Pendant un cycle CONTACT ou NULL, le bouton METER est barré et le MUSE est choisi d'office.</strong> Ces cycles se calculent sur la charge EEG : suivre leurs phases sur l'aiguille des boîtes reviendrait à les lire sur un mouvement qui ne les a pas produites. Votre choix n'est pas perdu — il revient dès que le cycle est terminé.`,
        it:`<strong>Durante un ciclo CONTACT o NULL il pulsante METER è barrato e il MUSE è scelto d'ufficio.</strong> Quei cicli si calcolano sulla carica EEG: seguirne le fasi sull'ago delle boîtes vorrebbe dire leggerle su un movimento che non le ha prodotte. La tua scelta non si perde — torna appena il ciclo finisce.`,
        en:`<strong>During a CONTACT or NULL cycle the METER button is struck through and the MUSE is selected automatically.</strong> Those cycles are computed on the EEG charge: following their phases on the cans' needle would mean reading them off a movement that did not produce them. Your choice is not lost — it returns as soon as the cycle ends.`}),
    P({fr:`<strong>Le sélecteur se bloque aussi dans l'autre sens.</strong> Pendant les deux tests des boîtes — le serrement et le souffle — c'est l'aiguille du <strong>METER</strong> qui s'impose : ces tests règlent la <em>sensibilité du METER</em> en regardant où <em>son</em> aiguille arrive par rapport au repère du tiers. Les faire avec le MUSE devant reviendrait à tarer un instrument en en regardant un autre — une erreur qui ne se voit pas, puisque l'aiguille bouge quand même.`,
        it:`<strong>Il selettore si blocca anche nell'altro senso.</strong> Durante le due prove delle boîtes — la stretta e il soffio — si impone l'ago del <strong>METER</strong>: quelle prove regolano la <em>sensibilità del METER</em> guardando dove arriva la <em>sua</em> lancetta rispetto al segno del terzo. Farle col MUSE davanti sarebbe tarare uno strumento guardandone un altro — un errore che non si vede, perché l'ago si muove lo stesso.`,
        en:`<strong>The selector locks the other way too.</strong> During the cans' two tests — the squeeze and the breath — the <strong>METER</strong> needle is imposed: those tests set the <em>METER's sensitivity</em> by watching where <em>its</em> needle lands relative to the one-third mark. Doing them with the MUSE on screen would mean calibrating one instrument while watching another — a mistake you cannot see, since the needle moves either way.`}),
    NOTE("info",UI.L_info,{fr:`Le <strong>journal</strong> dit maintenant de quelle aiguille vient chaque réaction : « ⊙ MUSE · Long Fall », « ⊙ METER · Fall ». Avant, seules les réactions du MUSE y étaient écrites — et avec le METER à l'écran, tout semblait venir de ce qu'on regardait. Les réactions du METER s'écrivent en outre dans la <strong style="color:#f59e0b">couleur de son aiguille</strong> : on reconnaît la source sans lire le sigle.`,
        it:`Il <strong>journal</strong> dice ora da quale ago viene ogni reazione: « ⊙ MUSE · Long Fall », « ⊙ METER · Fall ». Prima ci finivano solo le reazioni del MUSE — e col METER sullo schermo tutto sembrava venire da ciò che si guardava. Le reazioni del METER si scrivono inoltre nel <strong style="color:#f59e0b">colore del suo ago</strong>: si riconosce la sorgente senza leggere la sigla.`,
        en:`The <strong>journal</strong> now says which needle each reaction came from: "⊙ MUSE · Long Fall", "⊙ METER · Fall". Before, only the MUSE's reactions were written there — and with the METER on screen everything looked like it came from what you were watching. METER reactions are moreover written in <strong style="color:#f59e0b">their needle's colour</strong>: you recognise the source without reading the tag.`})]},

/* ───────────────────────── TONE ARM ───────────────────────── */
{ id:"m-ta", grp:"dial", t:{fr:"Tone Arm (TA) & Total TA",it:"Tone Arm (TA) & Total TA",en:"Tone Arm (TA) & Total TA"},
  role:[
    P({fr:`Le <strong>Tone Arm</strong> suit la dérive de fond : là où l'aiguille montre l'instant, le TA montre le niveau général et son déplacement au fil de la séance. Le <strong>Total TA</strong> cumule tout le mouvement produit — c'est une mesure de travail accompli.`,
        it:`Il <strong>Tone Arm</strong> segue la deriva di fondo: dove l'ago mostra l'istante, il TA mostra il livello generale e il suo spostamento nel corso della seduta. Il <strong>Total TA</strong> cumula tutto il movimento prodotto — è una misura del lavoro compiuto.`,
        en:`The <strong>Tone Arm</strong> follows the underlying drift: where the needle shows the instant, the TA shows the general level and how it moves through the session. <strong>Total TA</strong> accumulates all the movement produced — a measure of work done.`}),
    SHOT("ta-lecture.png",{fr:"La lecture du Tone Arm",it:"La lettura del Tone Arm",en:"The Tone Arm readout"},1)],
  on:[ P({fr:`Affiché en permanence pendant la séance. Avec le THETA-METER branché, le taraudage de l'échelle et l'E-METER TESTER sont dans le tiroir <span class="tag">TRIM</span>, section <strong>BOÎTES</strong> (ils ne sont plus dans CONFIG : ils ne concernent que l'appareil réel).`,it:`Mostrato in permanenza durante la seduta. Col THETA-METER collegato, la taratura della scala e l'E-METER TESTER sono nel cassetto <span class="tag">TRIM</span>, sezione <strong>BOÎTES</strong> (non sono più in CONFIG: riguardano solo l'apparecchio vero).`,en:`Always shown during the session. With the THETA-METER connected, the scale calibration and the E-METER TESTER live in the <span class="tag">TRIM</span> drawer, <strong>CANS</strong> section (they are no longer in CONFIG: they concern the real device only).`}),
    SHOT("ta-calibrage.png",{fr:"Le panneau de calibrage TA",it:"Il pannello di calibrazione TA",en:"The TA calibration panel"})],
  off:[ P({fr:`Le TA fait partie du cadran et ne se masque pas ; seul son panneau de calibrage se referme.`,it:`Il TA fa parte del quadrante e non si nasconde; solo il suo pannello di calibrazione si richiude.`,en:`The TA is part of the dial and cannot be hidden; only its calibration panel closes.`})],
  in:[
    H4({fr:"Deux TA, selon l'instrument",it:"Due TA, secondo lo strumento",en:"Two TAs, depending on the instrument"}),
    P({fr:`Avec le <strong>THETA-METER</strong>, le TA est la position du <strong>bras</strong> lue sur une échelle taraudée avec l'artefact : c'est une <strong>résistance mesurée</strong>, en ohms, exactement comme la molette d'un mètre physique. Le Total TA se compte alors en <strong>divisions de TA</strong> réelles. Sans l'appareil, le TA est reconstruit depuis l'EEG — et c'est là que s'applique la mise en garde ci-dessous.`,
        it:`Col <strong>THETA-METER</strong>, il TA è la posizione del <strong>braccio</strong> letta su una scala tarata con l'artefatto: è una <strong>resistenza misurata</strong>, in ohm, esattamente come la manopola di un meter fisico. Il Total TA si conta allora in <strong>divisioni di TA</strong> vere. Senza l'apparecchio, il TA è ricostruito dall'EEG — ed è lì che vale l'avvertenza qui sotto.`,
        en:`With the <strong>THETA-METER</strong>, the TA is the <strong>arm</strong>'s position read on a scale calibrated with the artifact: a <strong>measured resistance</strong>, in ohms, exactly like a physical meter's knob. Total TA is then counted in real <strong>TA divisions</strong>. Without the device, the TA is reconstructed from the EEG — and that is where the warning below applies.`}),
    P({fr:`Le TA <strong>reconstruit à partir de l'EEG</strong> n'est pas mesuré comme sur un e-mètre classique. La base constitutionnelle suit la convention : <strong>3 pour l'homme, 2 pour la femme</strong> — c'est cette base que le CLEAR READ vise.`,
        it:`Il TA <strong>ricostruito dall'EEG</strong> non è misurato come su un e-meter classico. La base costituzionale segue la convenzione: <strong>3 per l'uomo, 2 per la donna</strong> — è questa base che il CLEAR READ punta.`,
        en:`The TA <strong>reconstructed from the EEG</strong> is not measured as on a classic e-meter. The constitutional base follows the convention: <strong>3 for a man, 2 for a woman</strong> — that base is what CLEAR READ aims at.`}),
    NOTE("warn",UI.L_warn,{fr:`<strong>Sans le METER, lisez le MOUVEMENT, pas le nombre.</strong> Le TA reconstruit depuis l'EEG n'a pas de correspondance fiable avec les ohms d'un vrai mètre — nous avons essayé de l'établir, sur 3 personnes et 2 appareils, sans y parvenir. Ce qui reste solide et sur quoi vous pouvez travailler : <strong>de combien</strong> le TA se déplace, <strong>dans quel sens</strong>, et le <strong>Total TA</strong> accumulé. Avec le THETA-METER branché, la question ne se pose plus : le nombre est une résistance mesurée.`,
        it:`<strong>Senza il METER, leggi il MOVIMENTO, non il numero.</strong> Il TA ricostruito dall'EEG non ha una corrispondenza affidabile con gli ohm di un meter vero — abbiamo provato a stabilirla, su 3 persone e 2 apparecchi, senza riuscirci. Ciò che resta solido e su cui puoi lavorare: <strong>di quanto</strong> il TA si sposta, <strong>in che senso</strong>, e il <strong>Total TA</strong> accumulato. Col THETA-METER collegato la questione non si pone più: il numero è una resistenza misurata.`,
        en:`<strong>Without the METER, read the MOVEMENT, not the number.</strong> The TA reconstructed from the EEG has no reliable correspondence with a real meter's ohms — we tried to establish one, across 3 people and 2 devices, and could not. What remains solid, and what you can work on: <strong>how far</strong> the TA travels, <strong>in which direction</strong>, and the accumulated <strong>Total TA</strong>. With the THETA-METER connected the question disappears: the number is a measured resistance.`}),
    SHOT("ta-total.png",{fr:"Le Total TA dans le rapport",it:"Il Total TA nel rapporto",en:"Total TA in the report"},1)]},

/* ───────────────────────── CYCLE CONTACT ───────────────────────── */
{ id:"m-contact", grp:"dial", t:{fr:"Cycle CONTACT → DISSOLUTION → AS-IS",it:"Ciclo CONTACT → DISSOLUTION → AS-IS",en:"CONTACT → DISSOLUTION → AS-IS cycle"},
  role:[
    P({fr:`Le cycle de la <strong>charge qui lit</strong>. On donne l'item, l'aiguille réagit, et l'on suit la charge jusqu'à sa dissolution complète.`,
        it:`Il ciclo della <strong>carica che legge</strong>. Si dà l'item, l'ago reagisce, e si segue la carica fino alla sua dissoluzione completa.`,
        en:`The cycle for a <strong>charge that reads</strong>. You give the item, the needle reacts, and you follow the charge to full dissolution.`}),
    SHOT("contact-arc.png",{fr:"L'arc du cycle CONTACT",it:"L'arco del ciclo CONTACT",en:"The CONTACT cycle arc"})],
  on:[ P({fr:`Énoncez l'item, puis pressez le bouton <span class="tag en">CONTACT</span> sous le cadran. Le moment de la pression sert de repère pour mesurer le temps de réaction.`,
        it:`Enuncia l'item, poi premi il pulsante <span class="tag en">CONTACT</span> sotto il quadrante. Il momento della pressione serve da riferimento per misurare il tempo di reazione.`,
        en:`Say the item, then press the <span class="tag en">CONTACT</span> button below the dial. The press moment is the reference for measuring reaction time.`})],
  off:[ P({fr:`Re-pressez le même bouton : le cycle se referme, même s'il n'a pas abouti. Il sera consigné au rapport comme non mené à terme — rien n'est perdu ni caché.`,

    UL({fr:[`<span class="tag en">CONTACT</span> — la charge est contactée.`,

    H4({fr:"Le comm lag — le retard de communication",it:"Il comm lag — il ritardo di comunicazione",en:"The comm lag — communication delay"}),
    P({fr:`Le <strong>comm lag</strong> est le temps que met votre item pour <strong>arriver jusqu'au mental du préclear et y produire une réaction visible</strong>. Vous donnez l'item ; l'aiguille ne répond pas à l'instant même, mais quelques centaines de millisecondes plus tard. Ce délai, c'est le comm lag.`,
        it:`Il <strong>comm lag</strong> è il tempo che il tuo item impiega per <strong>arrivare al mentale del preclear e produrvi una reazione visibile</strong>. Dai l'item; l'ago non risponde nell'istante stesso, ma qualche centinaio di millisecondi dopo. Quel ritardo è il comm lag.`,
        en:`The <strong>comm lag</strong> is the time your item takes to <strong>reach the preclear's mind and produce a visible reaction there</strong>. You give the item; the needle does not answer at that very instant, but a few hundred milliseconds later. That delay is the comm lag.`}),
    P({fr:`Il est <strong>propre à chaque préclear</strong>. L'app le mesure à chaque cycle armé et l'affine au fil de la séance : au début elle affiche une valeur de départ (précédée de « ~ »), puis la valeur mesurée sur ce PC. Un comm lag qui <strong>raccourcit</strong> au fil des séances est en soi une indication : le préclear répond plus vite, il est plus présent.`,
        it:`È <strong>proprio di ogni preclear</strong>. L'app lo misura ad ogni ciclo armato e lo affina nel corso della seduta: all'inizio mostra un valore di partenza (preceduto da « ~ »), poi il valore misurato su quel PC. Un comm lag che si <strong>accorcia</strong> nel corso delle sedute è già di per sé un'indicazione: il preclear risponde più in fretta, è più presente.`,
        en:`It is <strong>particular to each preclear</strong>. The app measures it on every armed cycle and refines it through the session: at first it shows a starting value (prefixed with "~"), then the value measured on this PC. A comm lag that <strong>shortens</strong> across sessions is itself an indication: the preclear answers faster, they are more present.`}),
    NOTE("info",UI.L_note,{fr:`Les valeurs aberrantes sont écartées : une réaction trop immédiate (le préclear réagissait déjà) ou trop tardive (elle n'est plus attribuable à l'item) ne sont pas comptées comme comm lag.`,

        en:`Outliers are discarded: a reaction that is too immediate (the preclear was already reacting) or too late (no longer attributable to the item) does not count as comm lag.`}),
    SHOT("contact-asis.png",{fr:"La validation de l'AS-IS",it:"La validazione dell'AS-IS",en:"Validating the AS-IS"},1)]},

        it:`L'altra metà del lavoro: il ciclo dell'item che <strong>non legge</strong>. Un item nullo è ambiguo — nullo perché pulito, o nullo perché nulla risponde? Questo ciclo scioglie il dubbio.`,

  on:[ P({fr:`Pressez <span class="tag en">NULL</span> après avoir donné l'item, puis demandez au préclear de faire un <span class="tag en">MOCK-UP</span> — de créer de la masse mentalement.`,
        it:`Premi <span class="tag en">NULL</span> dopo aver dato l'item, poi chiedi al preclear di fare un <span class="tag en">MOCK-UP</span> — di creare massa mentalmente.`,

            `Validation avec les <span class="tag en">VGI's</span> — vous inscrivez leur présence ou leur absence.`,

        it:[`<span class="tag en">RISE</span> — il mock-up crea massa: lo strumento <em>e</em> il preclear rispondono.`,
            `<span class="tag en">CLEAR READ</span> — il TA torna alla base e <strong>ci resta</strong>. Un semplice passaggio non basta: conta la <strong>tenuta</strong>. Base: <strong>3 uomo · 2 donna</strong>.`,

        en:[`<span class="tag en">RISE</span> — the mock-up creates mass: instrument <em>and</em> preclear respond.`,
            `<span class="tag en">CLEAR READ</span> — the TA returns to base and <strong>stays there</strong>. A mere pass is not enough: the <strong>hold</strong> is what counts. Base: <strong>3 man · 2 woman</strong>.`,
            `Validation with the <span class="tag en">VGI's</span> — you record their presence or absence.`,

    NOTE("info",UI.L_note,{fr:`Le temps du mock-up n'est <strong>pas</strong> imposé : chaque préclear a le sien. L'app affiche le temps écoulé à titre indicatif, sans compte à rebours.`,

{ id:"m-mirror", grp:"dial", t:{fr:"MIRROR — la méthode du double (Ron)",it:"MIRROR — il metodo del doppio (Ron)",en:"MIRROR — the doubling method (Ron)"},
  role:[
    P({fr:`D'après Ron : <em>« doubler la charge instantanée pour l'effacer »</em>. On travaille <strong>item par item</strong> sur un cadran de 1 à 10, où chaque nombre porte son double entre parenthèses — 1 (2), 2 (4), 3 (6)… Le premier nombre est la charge rencontrée ; le second, le total à décharger pour l'effacer.`,
        it:`Secondo Ron: <em>« raddoppiare la carica istantanea per cancellarla »</em>. Si lavora <strong>item per item</strong> su un quadrante da 1 a 10, dove ogni numero porta il suo doppio tra parentesi — 1 (2), 2 (4), 3 (6)… Il primo numero è la carica incontrata; il secondo, il totale da smaltire per cancellarla.`,
        en:`After Ron: <em>"double the instant charge to erase it"</em>. You work <strong>item by item</strong> on a 1-to-10 dial where each number carries its double in parentheses — 1 (2), 2 (4), 3 (6)… The first number is the charge encountered; the second, the total to discharge to erase it.`}),
    SHOT("mirror-cadran.png",{fr:"Le cadran MIRROR avec l'échelle 1–10 et les doubles",it:"Il quadrante MIRROR con la scala 1–10 e i doppi",en:"The MIRROR dial with the 1–10 scale and doubles"})],
  on:[

        it:`Scegli la vista <span class="tag">MIRROR</span> nel selettore, poi dai l'item — scrivendolo nel campo oppure <strong>a voce</strong>: se il campo è vuoto, la prima frase che pronunci diventa l'item e la misura si ancora a quel preciso momento.`,
        en:`Pick the <span class="tag">MIRROR</span> view in the selector, then give the item — either typed in the field or <strong>aloud</strong>: if the field is empty, the first sentence you say becomes the item and the measurement anchors to that exact moment.`}),
    SHOT("mirror-item.png",{fr:"Donner l'item (champ ou à la voix)",it:"Dare l'item (campo o a voce)",en:"Giving the item (field or aloud)"},1)],

        en:`Go back to <span class="tag">AGO</span> or <span class="tag">AGO +</span>. The running MIRROR cycle stays in memory until you validate it.`})],
  in:[
    H4({fr:"Les trois temps",it:"I tre tempi",en:"The three beats"}),
    UL({fr:[`<strong>a) La valeur de l'item.</strong> Dès l'item donné, l'app mesure la charge <strong>au contact</strong> et la fige sur 1–10. Elle ne bouge plus : c'est « la charge de cet item ».`,
            `<strong>b) La cible.</strong> La <strong style="color:var(--warn)">ligne jaune ×2</strong> marque le double. Si le double dépasse 10, l'app l'indique comme hors échelle (« ×2 › ») plutôt que de mentir.`,
            `<strong>c) Obtenu.</strong> On fait tourner l'item ; l'anneau de progression avance à mesure que la charge se décharge. Quand le déchargé atteint le double → <strong style="color:var(--ok)">OBTENU</strong>. Vous pressez <span class="tag">VALIDER</span> et passez à l'item suivant.`],
        it:[`<strong>a) Il valore dell'item.</strong> Appena dato l'item, l'app misura la carica <strong>al contatto</strong> e la fissa su 1–10. Non si muove più: è « la carica di quell'item ».`,
            `<strong>b) La cible.</strong> La <strong style="color:var(--warn)">linea gialla ×2</strong> segna il doppio. Se il doppio supera 10, l'app lo indica come fuori scala (« ×2 › ») invece di mentire.`,
            `<strong>c) Ottenuto.</strong> Si fa girare l'item; l'anello di avanzamento avanza mentre la carica si smaltisce. Quando lo smaltito raggiunge il doppio → <strong style="color:var(--ok)">OTTENUTO</strong>. Premi <span class="tag">VALIDA</span> e passi all'item successivo.`],
        en:[`<strong>a) The item's value.</strong> As soon as the item is given, the app measures the charge <strong>at contact</strong> and freezes it on 1–10. It no longer moves: this is "the charge of this item".`,
            `<strong>b) The target.</strong> The <strong style="color:var(--warn)">yellow ×2 line</strong> marks the double. If the double exceeds 10, the app shows it as off-scale ("×2 ›") rather than lying.`,
            `<strong>c) Obtained.</strong> Run the item; the progress ring advances as the charge discharges. When the discharged reaches the double → <strong style="color:var(--ok)">OBTAINED</strong>. Press <span class="tag">VALIDATE</span> and move to the next item.`]}),
    SHOT("mirror-obtenu.png",{fr:"OBTENU : la cible est atteinte",it:"OTTENUTO: la cible è raggiunta",en:"OBTAINED: the target is reached"}),
