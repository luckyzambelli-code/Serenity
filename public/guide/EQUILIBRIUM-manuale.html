<title>EQUILIBRIUM — Manuel complet</title>
<style>
  :root{
    --bg:#0c1018; --panel:#121824; --card:#111622; --ink:#e8eef8; --muted:#95a0b5;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
    --accent:#5eb8ff; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --measure:72ch;
  }
  :root[data-theme="light"]{
    --bg:#f4f6fa; --panel:#ffffff; --card:#ffffff; --ink:#101722; --muted:#5a6478;
    --line:rgba(16,23,34,.12); --line-2:rgba(16,23,34,.07);
    --accent:#0d6fbf; --ok:#0e8a66; --warn:#a9741a; --danger:#c2410c;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6fa; --panel:#ffffff; --card:#ffffff; --ink:#101722; --muted:#5a6478;
      --line:rgba(16,23,34,.12); --line-2:rgba(16,23,34,.07);
      --accent:#0d6fbf; --ok:#0e8a66; --warn:#a9741a; --danger:#c2410c;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.62;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .layout{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
  nav{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:1.15rem 1rem 2.5rem}
  nav .brand{display:flex;align-items:center;gap:9px;margin-bottom:2px}
  nav .brand svg{width:17px;height:17px;flex:none}
  nav h1{font-size:.95rem;margin:0;letter-spacing:.13em;font-weight:800}
  nav .ver{color:var(--muted);font-size:.72rem;font-family:var(--mono);margin:0 0 .9rem 26px}
  .langs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;margin-bottom:1rem}
  .langs button{flex:1;font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.06em;border:none;background:transparent;color:var(--muted);padding:5px 0;border-radius:999px;cursor:pointer}
  .langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
  nav a.nl{display:block;color:var(--muted);font-size:.81rem;padding:.38rem .5rem;border-radius:6px;margin-bottom:1px}
  nav a.nl:hover{background:var(--line-2);color:var(--ink);text-decoration:none}
  nav .sec{margin:1.05rem 0 .3rem;font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);opacity:.75;padding:0 .5rem;font-weight:700}

  main{padding:2.6rem 3rem 6rem;max-width:1080px;min-width:0}
  .hero{margin-bottom:2.2rem}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .hero h2{font-size:clamp(1.9rem,4vw,2.6rem);margin:.3em 0 .25em;border:none;padding:0;letter-spacing:-.02em;line-height:1.06}
  .lead{font-size:1.06rem;color:var(--muted);max-width:62ch;margin:0}
  h2{font-size:1.5rem;margin:3.2rem 0 1rem;border-bottom:1px solid var(--line);padding-bottom:.5rem;font-weight:750;letter-spacing:-.01em}
  h3{font-size:1.18rem;margin:0 0 .2rem;color:var(--accent);font-weight:700}
  h4{font-size:.94rem;margin:1.5rem 0 .35rem;color:var(--ink);font-weight:700;opacity:.86}
  p,li{color:var(--ink);opacity:.86}
  p{margin:.85em 0;max-width:var(--measure)}
  ul{max-width:var(--measure);padding-left:1.15rem}
  li{margin:.32em 0}
  strong{font-weight:700;opacity:1}

  .step{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:1rem 1.25rem;margin-bottom:1.1rem;border-radius:0 10px 10px 0}
  .step h4{margin:0 0 .2rem;font-size:1rem;opacity:1}
  .step .sn{font-family:var(--mono);font-size:.72rem;color:var(--accent);font-weight:700;letter-spacing:.08em}
  .step p{margin:.4em 0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.5rem 1.6rem;margin-bottom:1.6rem}
  .card>h3{margin-top:0}
  .card .part{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin:1.6rem 0 .5rem;padding-top:.9rem;border-top:1px solid var(--line-2);font-weight:700}
  .card .part:first-of-type{margin-top:1.2rem}

  .tag{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:.1rem .45rem;border-radius:4px;
    border:1px solid var(--line);color:var(--accent);background:var(--line-2);white-space:nowrap}
  .tag.en{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  code{font-family:var(--mono);font-size:.86em;background:var(--line-2);padding:.08em .35em;border-radius:4px}

  .tw{overflow-x:auto;margin:1rem 0 1.3rem;max-width:var(--measure)}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line-2);vertical-align:top}
  th{color:var(--muted);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;background:var(--line-2)}
  td.btn{font-family:var(--mono);color:var(--accent);white-space:nowrap;font-weight:600}
  td{opacity:.9}

  .math-block{background:var(--line-2);border:1px solid var(--line);padding:.9rem 1.1rem;border-radius:8px;
    margin:1rem 0;font-family:var(--mono);color:var(--accent);font-size:.9rem;overflow-x:auto;max-width:var(--measure)}
  pre{background:var(--line-2);border:1px solid var(--line);padding:1rem;border-radius:8px;
    font-family:var(--mono);font-size:.8rem;overflow-x:auto;max-width:var(--measure);color:var(--ink)}

  .note{margin:1.1rem 0;border:1px solid var(--line);border-left-width:3px;border-radius:10px;
    padding:.9rem 1.1rem;max-width:var(--measure);background:var(--line-2)}
  .note .nl{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:.3rem}
  .note p{margin:.3em 0;max-width:none}
  .note.info{border-left-color:var(--accent)} .note.info .nl{color:var(--accent)}
  .note.warn{border-left-color:var(--warn)} .note.warn .nl{color:var(--warn)}
  .note.ok{border-left-color:var(--ok)} .note.ok .nl{color:var(--ok)}

  /* ── emplacements de captures d'écran ── */
  .shot{margin:1.1rem 0 1.4rem;max-width:820px}
  .shot.sm{max-width:480px}
  .shot img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .shot .ph{display:none;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;
    min-height:150px;padding:1.2rem;border:2px dashed color-mix(in srgb,var(--accent) 38%,transparent);
    border-radius:10px;background:var(--line-2);text-align:center}
  .shot.sm .ph{min-height:110px}
  .shot .ph .cam{font-size:1.3rem;color:var(--accent);opacity:.7;line-height:1}
  .shot .ph b{font-family:var(--mono);font-size:.76rem;color:var(--accent);word-break:break-all}
  .shot .ph i{font-size:.8rem;color:var(--muted);font-style:normal;max-width:46ch}

  .end{margin-top:3.5rem;padding-top:1.3rem;border-top:1px solid var(--line);color:var(--muted);
    font-family:var(--mono);font-size:.76rem;line-height:1.75;max-width:var(--measure)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  @media (max-width:920px){
    .layout{grid-template-columns:1fr}
    nav{position:relative;height:auto}
    main{padding:1.5rem 1.25rem 4rem}
  }
  @media print{
    .layout{grid-template-columns:1fr} nav{display:none} main{padding:0;max-width:none}
    body{background:#fff;color:#000} .card,.step,.note,.shot,.tw{break-inside:avoid}
    .shot .ph{border-color:#999}
  }
</style>

<div class="layout">
  <nav>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20" fill="none" stroke="var(--ok)" stroke-width="2.4"/><circle cx="12" cy="12" r="2.3" fill="var(--warn)"/><path d="M12 12 4.8 5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <h1>EQUILIBRIUM</h1>
    </div>
    <div class="ver">v1.0.377</div>
    <div class="langs" role="group" aria-label="Langue / Lingua / Language">
      <button data-lang="fr" aria-pressed="true">FR</button>
      <button data-lang="it" aria-pressed="false">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div id="navlinks"></div>
  </nav>
  <main id="doc"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   EQUILIBRIUM — contenu du manuel, PARTIE 1 : navigation, helpers, tutoriel.
   Trilingue FR / IT / EN. Les TERMES D'AUDITION restent en ANGLAIS partout.
   Tout le contenu est VÉRIFIÉ sur le code source (v1.0.377).
   ═══════════════════════════════════════════════════════════════════════ */
/* ── VERSIONE DESCRITTA DA QUESTO MANUALE ────────────────────────────────────────────────
   Una riga sola, e la sola da cambiare: prima il numero stava scritto a mano TRE volte a piè
   di pagina (una per lingua) ed era rimasto a 2.0.19 per sessanta build. Questo file è
   autonomo — non legge `package.json` — quindi va aggiornato a mano, ma adesso in un posto. */
const VERSIONE = "2.0.151";

let LANG = "fr";
const tr = o => (o && typeof o === "object" && !Array.isArray(o)) ? (o[LANG] ?? o.en) : o;

/* ── blocs ── */
const P    = o => () => `<p>${tr(o)}</p>`;
const UL   = o => () => `<ul>${tr(o).map(x => `<li>${x}</li>`).join("")}</ul>`;
const H4   = o => () => `<h4>${tr(o)}</h4>`;
const CODE = s => () => `<pre>${s}</pre>`;
const MATH = s => () => `<div class="math-block">${s}</div>`;
const NOTE = (tone, label, o) => () =>
  `<aside class="note ${tone}"><span class="nl">${tr(label)}</span>${tr(o).split("|").map(x => `<p>${x}</p>`).join("")}</aside>`;
const TABLE = (heads, rows) => () =>
  `<div class="tw"><table><thead><tr>${tr(heads).map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${tr(r).map((c, i) => `<td${i === 0 ? ' class="btn"' : ""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* ── emplacement de CAPTURE D'ÉCRAN ──
   Si le fichier existe → l'image s'affiche. Sinon → cadre pointillé avec le
   nom exact du fichier à créer. C'est là que tu déposes tes captures. */
const SHOT = (file, cap, small) => () =>
  `<figure class="shot${small ? " sm" : ""}">
     <img src="docs/guide-screenshots/${file}" alt="${tr(cap)}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
          onload="this.nextElementSibling.style.display='none'">
     <div class="ph"><span class="cam">▣</span><b>docs/guide-screenshots/${file}</b><i>${tr(cap)}</i></div>
   </figure>`;

/* ── étiquettes d'interface ── */
const UI = {
  sub:      { fr: "Manuel complet", it: "Manuale completo", en: "Complete manual" },
  eyebrow:  { fr: "E-mètre EEG · casque MUSE 2 · THETA-METER USB", it: "E-meter EEG · casco MUSE 2 · THETA-METER USB", en: "EEG e-meter · MUSE 2 headband · THETA-METER USB" },
  lede:     { fr: "Manuel d'utilisation : chaque zone, chaque module, chaque bouton — à quoi il sert, comment l'activer, comment le masquer, et comment s'en servir en séance.",
              it: "Manuale d'uso: ogni zona, ogni modulo, ogni pulsante — a cosa serve, come attivarlo, come nasconderlo, e come usarlo in seduta.",
              en: "User manual: every zone, every module, every button — what it does, how to turn it on, how to hide it, and how to use it in session." },
  navGuide: { fr: "Guide utilisateur", it: "Guida utente", en: "User guide" },
  navCore:  { fr: "I. Base & configuration", it: "I. Base & configurazione", en: "I. Core & configuration" },
  navDial:  { fr: "II. Le cadran", it: "II. Il quadrante", en: "II. The dial" },
  navMod:   { fr: "III. Modules latéraux", it: "III. Moduli laterali", en: "III. Side modules" },
  navEnd:   { fr: "IV. Fin & problèmes", it: "IV. Fine & problemi", en: "IV. End & troubleshooting" },
  tuto:     { fr: "Guide pas à pas", it: "Guida passo a passo", en: "Step-by-step guide" },
  catalog:  { fr: "Catalogue des modules", it: "Catalogo dei moduli", en: "Module catalogue" },
  h1:       { fr: "À quoi sert le module", it: "A cosa serve il modulo", en: "What the module is for" },
  h2:       { fr: "Comment l'activer", it: "Come attivarlo", en: "How to turn it on" },
  h3:       { fr: "Comment le masquer", it: "Come nasconderlo", en: "How to hide it" },
  h4:       { fr: "En pratique", it: "In pratica", en: "In practice" },
  L_note:   { fr: "À noter", it: "Da notare", en: "Note" },
  L_warn:   { fr: "Attention", it: "Attenzione", en: "Warning" },
  L_ok:     { fr: "Bon à savoir", it: "Buono a sapersi", en: "Good to know" },
  shotHow:  { fr: "Vos captures d'écran", it: "Le tue schermate", en: "Your screenshots" },
  shotTxt:  { fr: `Chaque cadre pointillé attend <strong>une capture d'écran</strong>. Créez le dossier <code>docs/guide-screenshots/</code> à côté de ce fichier HTML et déposez-y vos images en respectant le nom indiqué dans le cadre. Elles apparaîtront automatiquement à la place du cadre.`,
              it: `Ogni riquadro tratteggiato attende <strong>una schermata</strong>. Crea la cartella <code>docs/guide-screenshots/</code> accanto a questo file HTML e mettici le immagini rispettando il nome indicato nel riquadro. Appariranno automaticamente al posto del riquadro.`,
              en: `Each dashed frame is waiting for <strong>a screenshot</strong>. Create the folder <code>docs/guide-screenshots/</code> next to this HTML file and drop your images in, using the filename shown in the frame. They will replace the frame automatically.` },
};

/* ═══════════════ TUTORIEL PAS À PAS ═══════════════ */
const STEPS = [
  { n: 1, t: { fr: "Lancer EQUILIBRIUM", it: "Avviare EQUILIBRIUM", en: "Launch EQUILIBRIUM" },
    d: { fr: `Ouvrez l'application. L'écran d'accueil apparaît ; la barre d'outils verticale (sidebar) est à gauche.`,
         it: `Apri l'applicazione. Compare la schermata iniziale; la barra verticale (sidebar) è a sinistra.`,
         en: `Open the application. The start screen appears; the vertical toolbar (sidebar) is on the left.` },
    s: "step01-lancement.png" },
  { n: 2, t: { fr: "Choisir l'auditeur et le préclear", it: "Scegliere auditor e preclear", en: "Choose auditor and preclear" },
    d: { fr: `Ouvrez la gestion des profils. Sélectionnez l'auditeur actif et le PC. Le <strong>sexe</strong> du PC fixe la base du CLEAR READ (<strong>3 homme · 2 femme</strong>). En séance solo, l'auditeur est aussi le PC.`,
         it: `Apri la gestione profili. Seleziona l'auditor attivo e il PC. Il <strong>sesso</strong> del PC fissa la base del CLEAR READ (<strong>3 uomo · 2 donna</strong>). In seduta solo, l'auditor è anche il PC.`,
         en: `Open profile management. Select the active auditor and the PC. The PC's <strong>sex</strong> sets the CLEAR READ base (<strong>3 man · 2 woman</strong>). In a solo session the auditor is also the PC.` },
    s: "step02-profils.png" },
  { n: 3, t: { fr: "Choisir l'instrument", it: "Scegliere lo strumento", en: "Choose the instrument" },
    d: { fr: `Au premier <span class="tag en">START</span> le panneau <strong>BRANCHER UN INSTRUMENT</strong> s'ouvre. Trois configurations : le <strong>MUSE 2</strong> seul, le <strong>THETA-METER</strong> (les boîtes) seul, ou <strong>les deux</strong>. Cliquez l'un, l'autre, ou les deux — un clic de trop se déselectionne. Ce choix commande la suite : les modules qui ne sont pas exploitables par l'instrument choisi se cachent d'eux-mêmes.`,
         it: `Al primo <span class="tag en">START</span> si apre il pannello <strong>COLLEGA UNO STRUMENTO</strong>. Tre configurazioni: il <strong>MUSE 2</strong> solo, il <strong>THETA-METER</strong> (le boîtes) solo, oppure <strong>tutti e due</strong>. Clicca l'uno, l'altro o entrambi — un clic di troppo si deseleziona. Questa scelta comanda il resto: i moduli che non sono sfruttabili dallo strumento scelto si nascondono da sé.`,
         en: `On the first <span class="tag en">START</span> the <strong>CONNECT AN INSTRUMENT</strong> panel opens. Three configurations: the <strong>MUSE 2</strong> alone, the <strong>THETA-METER</strong> (the cans) alone, or <strong>both</strong>. Click one, the other, or both — one click too many deselects. This choice drives everything after it: modules the chosen instrument cannot serve hide themselves.` },
    s: "step03-instrument.png" },
  { n: 4, t: { fr: "Connecter le MUSE 2", it: "Connettere il MUSE 2", en: "Connect the MUSE 2" },
    d: { fr: `Allumez le bandeau et <strong>mettez-le sur la tête</strong>. Appuyez sur <span class="tag en">CONNECTER</span>. Le badge passe au <strong style="color:var(--ok)">vert</strong> quand il est connecté <em>et porté</em>.`,
         it: `Accendi il casco e <strong>indossalo</strong>. Premi <span class="tag en">CONNETTI</span>. Il badge diventa <strong style="color:var(--ok)">verde</strong> quando è connesso <em>e indossato</em>.`,
         en: `Turn the headband on and <strong>put it on your head</strong>. Press <span class="tag en">CONNECT</span>. The badge turns <strong style="color:var(--ok)">green</strong> when connected <em>and worn</em>.` },
    s: "step03-connexion-muse.png" },
  { n: 5, t: { fr: "Vérifier le contact des électrodes", it: "Verificare il contatto degli elettrodi", en: "Check electrode contact" },
    d: { fr: `Ouvrez <strong>Santé système</strong> : les 4 canaux EEG (TP9, AF7, AF8, TP10) doivent montrer un signal vivant. Sans contact réel, la charge reste à zéro et l'aiguille ne réagit pas — c'est voulu.`,
         it: `Apri <strong>Salute sistema</strong>: i 4 canali EEG (TP9, AF7, AF8, TP10) devono mostrare un segnale vivo. Senza contatto reale la carica resta a zero e l'ago non reagisce — è voluto.`,
         en: `Open <strong>System health</strong>: the 4 EEG channels (TP9, AF7, AF8, TP10) must show a live signal. Without real contact the charge stays at zero and the needle does not react — by design.` },
    s: "step04-electrodes.png" },
  { n: 6, t: { fr: "Préparer les boîtes (THETA-METER)", it: "Preparare le boîtes (THETA-METER)", en: "Prepare the cans (THETA-METER)" },
    d: { fr: `Colonne de gauche, trois vérifications, l'aiguille reste visible pendant tout le contrôle. <strong>1.</strong> Dites si le PC tient <strong>deux boîtes</strong> ou <strong>une seule</strong> — la résistance n'est pas la même. <strong>2.</strong> <em>Serrez légèrement</em> : l'aiguille doit descendre jusqu'au <strong>repère</strong> tracé sur le cadran (un tiers). Sinon réglez la sensibilité avec <strong>±</strong>. <strong>3.</strong> Une inspiration profonde : l'aiguille doit tomber d'<strong>au moins un tiers</strong>. Le verdict est écrit en clair — CORRESPOND ou NE CORRESPOND PAS.`,
         it: `Colonna di sinistra, tre verifiche, e l'ago resta visibile durante tutto il controllo. <strong>1.</strong> Dichiara se il PC tiene <strong>due boîtes</strong> o <strong>una sola</strong> — la resistenza non è la stessa. <strong>2.</strong> <em>Stringi leggermente</em>: l'ago deve scendere fino al <strong>repère</strong> segnato sul quadrante (un terzo). Altrimenti regola la sensibilità con <strong>±</strong>. <strong>3.</strong> Un respiro profondo: l'ago deve cadere di <strong>almeno un terzo</strong>. Il verdetto è scritto in chiaro — CORRISPONDE o NON CORRISPONDE.`,
         en: `Left column, three checks, and the needle stays visible throughout. <strong>1.</strong> State whether the PC holds <strong>two cans</strong> or <strong>one</strong> — the resistance differs. <strong>2.</strong> <em>Squeeze gently</em>: the needle must fall to the <strong>mark</strong> drawn on the dial (one third). If not, set the sensitivity with <strong>±</strong>. <strong>3.</strong> One deep breath: the needle must fall <strong>at least a third</strong>. The verdict is spelled out — MATCHES or DOES NOT MATCH.` },
    s: "step05-boites.png" },
  { n: 7, t: { fr: "Le contrôle « Prêt pour la séance » — MUSE 2", it: "Il controllo « Pronto per la seduta » — MUSE 2", en: "The \"Ready for session\" check — MUSE 2" },
    d: { fr: `<strong>Cette étape est celle du MUSE 2</strong> : contact, calme, cœur et réactivité se lisent sur l'EEG et le pouls du bandeau. Une préparation courte, puis une <strong>respiration guidée</strong>. Le compte à rebours ne démarre <strong>que le casque porté</strong>.<br><em>Avec le seul THETA-METER, cet écran n'apparaît pas : ce sont les deux tests des boîtes (étape 6) qui tiennent ce rôle.</em>`,
         it: `<strong>Questa tappa è quella del MUSE 2</strong>: contatto, calma, cuore e reattività si leggono sull'EEG e sul battito del casco. Una breve preparazione, poi una <strong>respirazione guidata</strong>. Il conto alla rovescia parte <strong>solo col casco indossato</strong>.<br><em>Col solo THETA-METER questa schermata non compare: sono i due test delle boîtes (tappa 6) a fare questo lavoro.</em>`,
         en: `<strong>This step belongs to the MUSE 2</strong>: contact, calm, heart and reactivity are read from the headband's EEG and pulse. A short settle, then <strong>guided breathing</strong>. The countdown starts <strong>only once the headset is worn</strong>.<br><em>With the THETA-METER alone this screen does not appear: the cans' two tests (step 6) do this job instead.</em>` },
    s: "step05-pret-seance.png" },
  { n: 8, t: { fr: "Reprendre une séance : deux instruments, deux taraudages", it: "Riprendere una seduta: due strumenti, due tarature", en: "Resuming a session: two instruments, two calibrations" },
    d: { fr: `Si vous reprenez une séance où les <strong>boîtes sont déjà taraudées</strong>, l'écran de préparation du MUSE réapparaît quand même — et il ressemble à s'y méprendre au test que vous venez de faire. Une ligne ambrée vous le dit alors en clair : <em>les boîtes sont faites, celui-ci est celui du MUSE</em>. Ce sont deux instruments différents et ils se tarent séparément — l'un ne dispense pas de l'autre.`,
         it: `Se riprendi una seduta in cui le <strong>boîtes sono già tarate</strong>, la schermata di preparazione del MUSE ricompare lo stesso — e somiglia in tutto alla prova che hai appena fatto. Una riga in ambra te lo dice allora in chiaro: <em>le boîtes sono fatte, questa è quella del MUSE</em>. Sono due strumenti diversi e si tarano separatamente — l'uno non esenta dall'altro.`,
         en: `If you resume a session where the <strong>cans are already calibrated</strong>, the MUSE preparation screen appears anyway — and it looks exactly like the test you just did. An amber line then says it plainly: <em>the cans are done, this one is the MUSE's</em>. They are two different instruments and they are calibrated separately — one does not excuse the other.` },
    s: "step06b-reprise.png" },
  { n: 9, t: { fr: "Démarrer la séance", it: "Avviare la seduta", en: "Start the session" },
    d: { fr: `Le chronomètre part, le journal enregistre, l'aiguille devient vivante. C'est le point de départ de tout ce qui sera consigné au rapport.`,
         it: `Il cronometro parte, il journal registra, l'ago diventa vivo. È il punto di partenza di tutto ciò che finirà nel rapporto.`,
         en: `The clock starts, the journal records, the needle comes alive. This is the starting point for everything the report will contain.` },
    s: "step06-demarrer.png" },
  { n: 10, t: { fr: "Donner l'item ou la question d'audition", it: "Dare l'item o la domanda di auditing", en: "Give the item or the auditing question" },
    d: { fr: `Énoncez la question à voix haute. Vous pouvez aussi l'écrire dans le champ sous le cadran pour la consigner au journal et au rapport — mais ce que vous <strong>dites</strong> s'inscrit de toute façon au journal de séance.`,
         it: `Enuncia la domanda a voce. Puoi anche scriverla nel campo sotto il quadrante per registrarla nel journal e nel rapporto — ma ciò che <strong>dici</strong> finisce comunque nel journal di seduta.`,
         en: `Say the question aloud. You can also type it in the field below the dial so it is logged in the journal and the report — but what you <strong>say</strong> goes into the session journal regardless.` },
    s: "step07-item.png" },
  { n: 11, t: { fr: "Armer le cycle : CONTACT ou NULL", it: "Armare il ciclo: CONTACT o NULL", en: "Arm the cycle: CONTACT or NULL" },
    d: { fr: `<strong>L'aiguille réagit</strong> → <span class="tag en">CONTACT</span> : le cycle suit CONTACT → DISSOLUTION → AS-IS. <strong>Ceci mesure la dissolution de la charge par sa signature énergétique.</strong><br><strong>Rien ne lit</strong> → <span class="tag en">NULL</span> : on demande un MOCK-UP, la charge monte (RISE), puis le retour à la base = CLEAR READ.<br><br><strong>À quoi ça sert.</strong> Une charge contactée ne se défait pas d'un coup : elle se dissout. Le cycle suit cette dissolution en direct et vous dit <em>où vous en êtes</em> — au lieu de le deviner sur une aiguille qui bouge. Vous savez quand la charge est encore là, quand elle s'en va, et quand elle n'y est plus.<br><br><strong>Comment l'auditer.</strong> Donnez l'item, l'aiguille lit, pressez <span class="tag en">CONTACT</span>. Puis <em>ne faites rien</em> : laissez le préclear regarder la chose. Le cycle avance seul à mesure que la charge se défait — DISSOLUTION s'affiche. Quand elle est dissoute et que la F/N arrive, l'<span class="tag en">AS-IS</span> est proposé : c'est <strong>vous</strong> qui le validez, et jamais l'app.<br><em>Avec le seul THETA-METER les cycles sont masqués : ils reposent sur la charge mesurée par l'EEG, qui n'est pas là.</em>`,
         it: `<strong>L'ago reagisce</strong> → <span class="tag en">CONTACT</span>: il ciclo segue CONTACT → DISSOLUTION → AS-IS. <strong>Questo misura la dissoluzione della carica dalla sua firma energetica.</strong><br><strong>Non legge nulla</strong> → <span class="tag en">NULL</span>: si chiede un MOCK-UP, la carica sale (RISE), poi il ritorno alla base = CLEAR READ.<br><br><strong>A cosa serve.</strong> Una carica contattata non si scioglie di colpo: si dissolve. Il ciclo segue quella dissoluzione in diretta e ti dice <em>a che punto sei</em> — invece di indovinarlo su un ago che si muove. Sai quando la carica c'è ancora, quando se ne va, e quando non c'è più.<br><br><strong>Come si audita.</strong> Dai l'item, l'ago legge, premi <span class="tag en">CONTACT</span>. Poi <em>non fare niente</em>: lascia che il preclear guardi la cosa. Il ciclo avanza da sé man mano che la carica si disfa — compare DISSOLUZIONE. Quando è dissolta e arriva l'F/N, l'<span class="tag en">AS-IS</span> viene proposto: sei <strong>tu</strong> a validarlo, mai l'app.<br><em>Col solo THETA-METER i cicli sono nascosti: si reggono sulla carica misurata dall'EEG, che non c'è.</em>`,
         en: `<strong>The needle reads</strong> → <span class="tag en">CONTACT</span>: the cycle runs CONTACT → DISSOLUTION → AS-IS. <strong>This measures the dissolution of the charge from its energy signature.</strong><br><strong>Nothing reads</strong> → <span class="tag en">NULL</span>: ask for a MOCK-UP, the charge rises (RISE), then the return to base = CLEAR READ.<br><br><strong>What it is for.</strong> A charge that has been contacted does not come apart at once: it dissolves. The cycle follows that dissolution live and tells you <em>where you are</em> — instead of guessing it from a moving needle. You know when the charge is still there, when it is going, and when it is gone.<br><br><strong>How to audit it.</strong> Give the item, the needle reads, press <span class="tag en">CONTACT</span>. Then <em>do nothing</em>: let the preclear look at the thing. The cycle advances on its own as the charge comes apart — DISSOLUTION appears. When it is dissolved and the F/N arrives, <span class="tag en">AS-IS</span> is offered: <strong>you</strong> validate it, never the app.<br><em>With the THETA-METER alone the cycles are hidden: they are driven by the charge measured on the EEG, which is not there.</em>` },
    s: "step08-contact-null.png" },
  { n: 12, t: { fr: "Évaluer une liste : ASSESSMENT", it: "Valutare una lista: ASSESSMENT", en: "Assess a list: ASSESSMENT" },
    d: { fr: `Pour tester une liste d'items, pressez <span class="tag en">ASSESSMENT</span> et énoncez-les à la suite. Chaque mot reçoit son READ et l'écart où la réaction est survenue : <strong>−ms</strong> avant, <strong>+ms</strong> après. Seul l'<strong>instant read</strong> compte — à la fin exacte du mot ; une réaction qui arrive plus tard est <strong>latente</strong> et ne vaut pas.`,
         it: `Per testare una lista di item, premi <span class="tag en">ASSESSMENT</span> ed enunciali di seguito. Ogni parola riceve il suo READ e lo scarto in cui è avvenuta la reazione: <strong>−ms</strong> prima, <strong>+ms</strong> dopo. Conta solo l'<strong>instant read</strong> — alla fine esatta della parola; una reazione che arriva più tardi è <strong>latente</strong> e non vale.`,
         en: `To test a list of items, press <span class="tag en">ASSESSMENT</span> and say them one after another. Each word gets its READ and the offset at which the reaction occurred: <strong>−ms</strong> before, <strong>+ms</strong> after. Only the <strong>instant read</strong> counts — at the exact end of the word; a reaction arriving later is <strong>latent</strong> and does not count.` },
    s: "step09-assessment.png" },
  { n: 13, t: { fr: "Effacer par le double : MIRROR", it: "Cancellare col doppio: MIRROR", en: "Erase by doubling: MIRROR" },
    d: { fr: `Passez en vue <span class="tag en">MIRROR</span>, donnez l'item : sa charge est mesurée au contact et posée sur 1–10. La ligne jaune <strong>×2</strong> est la cible. Quand le déchargé l'atteint → <strong style="color:var(--ok)">OBTENU</strong>, puis <span class="tag en">VALIDER</span>.`,
         it: `Passa alla vista <span class="tag en">MIRROR</span>, dai l'item: la sua carica è misurata al contatto e posta su 1–10. La linea gialla <strong>×2</strong> è la cible. Quando lo smaltito la raggiunge → <strong style="color:var(--ok)">OTTENUTO</strong>, poi <span class="tag en">VALIDA</span>.`,
         en: `Switch to <span class="tag en">MIRROR</span>, give the item: its charge is measured at contact and placed on 1–10. The yellow <strong>×2</strong> line is the target. When the discharged reaches it → <strong style="color:var(--ok)">OBTAINED</strong>, then <span class="tag en">VALIDATE</span>.` },
    s: "step10-mirror.png" },
  { n: 14, t: { fr: "Valider la fin de cycle", it: "Validare la fine del ciclo", en: "Validate the end of cycle" },
    d: { fr: `<strong>Pour le cycle CONTACT</strong> : quand la charge est dissoute avec une F/N, l'<span class="tag en">AS-IS</span> est proposé — c'est <strong>vous</strong> qui le validez.<br><strong>Pour le cycle NULL</strong> : le <span class="tag en">CLEAR READ</span> se valide en inscrivant les <span class="tag en">VGI's</span>.`,
         it: `<strong>Per il ciclo CONTACT</strong>: quando la carica è dissolta con una F/N, l'<span class="tag en">AS-IS</span> viene proposto — sei <strong>tu</strong> a validarlo.<br><strong>Per il ciclo NULL</strong>: il <span class="tag en">CLEAR READ</span> si valida iscrivendo i <span class="tag en">VGI's</span>.`,
         en: `<strong>For the CONTACT cycle</strong>: when the charge is dissolved with an F/N, <span class="tag en">AS-IS</span> is offered — <strong>you</strong> validate it.<br><strong>For the NULL cycle</strong>: <span class="tag en">CLEAR READ</span> is validated by recording the <span class="tag en">VGI's</span>.` },
    s: "step11-validation.png" },
  { n: 15, t: { fr: "Terminer et exporter", it: "Terminare ed esportare", en: "End and export" },
    d: { fr: `Terminez la séance : le rapport s'ouvre (cycles CONTACT / NULL / MIRROR séparés, items ASSESSMENT, Total TA, courbe de charge, transcription). Il est sauvegardé et un <strong>PDF</strong> est produit.`,
         it: `Termina la seduta: si apre il rapporto (cicli CONTACT / NULL / MIRROR separati, item ASSESSMENT, Total TA, curva di carica, trascrizione). Viene salvato e prodotto un <strong>PDF</strong>.`,
         en: `End the session: the report opens (CONTACT / NULL / MIRROR cycles separately, ASSESSMENT items, Total TA, charge curve, transcript). It is saved and a <strong>PDF</strong> is produced.` },
    s: "step12-rapport.png" },
];

/* ───────────────────────── MUSE ───────────────────────── */
{ id:"m-muse", grp:"core", t:{fr:"MUSE 2 — connexion & signal",it:"MUSE 2 — connessione & segnale",en:"MUSE 2 — connection & signal"},
  role:[
    P({fr:`Le bandeau MUSE 2 fournit l'EEG (4 électrodes), le pouls (PPG), l'accéléromètre et le gyroscope. C'est la source de tout ce qui touche au <strong>mental</strong> : charge, cycles, MODULE NEURO ACOUSTIQUE, santé système. Depuis l'arrivée du <strong>THETA-METER</strong> il n'est plus la seule source possible — mais il reste la seule qui mesure la charge, et donc la seule qui fait avancer les cycles.`,
        it:`Il casco MUSE 2 fornisce l'EEG (4 elettrodi), il battito (PPG), l'accelerometro e il giroscopio. È la sorgente di tutto ciò che riguarda il <strong>mentale</strong>: carica, cicli, MODULO NEURO ACUSTICO, salute sistema. Da quando c'è il <strong>THETA-METER</strong> non è più l'unica sorgente possibile — ma resta l'unica che misura la carica, e quindi l'unica che fa avanzare i cicli.`,
        en:`The MUSE 2 headband provides EEG (4 electrodes), pulse (PPG), accelerometer and gyroscope. It is the source of everything to do with the <strong>mind</strong>: charge, cycles, NEURO-ACOUSTIC MODULE, system health. Since the <strong>THETA-METER</strong> arrived it is no longer the only possible source — but it remains the only one that measures charge, and therefore the only one that moves the cycles along.`}),
    SHOT("muse-badge.png",{fr:"Le badge d'état du MUSE",it:"Il badge di stato del MUSE",en:"The MUSE status badge"},1)],
  on:[
    P({fr:`Allumez le bandeau, <strong>mettez-le sur la tête</strong>, puis pressez <span class="tag">CONNECTER</span>. La fenêtre Bluetooth du système s'ouvre et le Muse est choisi automatiquement s'il est détecté.`,
        it:`Accendi il casco, <strong>indossalo</strong>, poi premi <span class="tag">CONNETTI</span>. Si apre la finestra Bluetooth di sistema e il Muse viene scelto automaticamente se rilevato.`,
        en:`Turn the headband on, <strong>put it on</strong>, then press <span class="tag">CONNECT</span>. The system Bluetooth window opens and the Muse is picked automatically when detected.`}),
    TABLE({fr:["Pastille du badge","Ce que ça veut dire"],it:["Pastiglia del badge","Cosa vuol dire"],en:["Badge dot","What it means"]},[
      {fr:["<span style='color:var(--ok)'>VERTE</span> · « MUSE ✓ »","Connecté <strong>et porté</strong> — les électrodes font contact, tout est prêt"],it:["<span style='color:var(--ok)'>VERDE</span> · « MUSE ✓ »","Connesso <strong>e indossato</strong> — gli elettrodi fanno contatto, tutto pronto"],en:["<span style='color:var(--ok)'>GREEN</span> · \"MUSE ✓\"","Connected <strong>and worn</strong> — the electrodes make contact, all set"]},
      {fr:["BLANCHE · « MUSE · non porté »","Connecté, mais le bandeau n'est pas sur la tête. Il ne produit aucune charge — l'aiguille ne réagira pas"],it:["BIANCA · « MUSE · non indossato »","Connesso, ma il casco non è in testa. Non produce carica — l'ago non reagirà"],en:["WHITE · \"MUSE · not worn\"","Connected, but the headband is not on the head. It produces no charge — the needle will not react"]},
      {fr:["Creuse et clignotante","Déconnecté, ou recherche en cours"],it:["Vuota e lampeggiante","Disconnesso, o ricerca in corso"],en:["Hollow and pulsing","Disconnected, or searching"]}]),
    NOTE("info",UI.L_info,{fr:`La pastille ne devient verte qu'<strong>une fois le bandeau porté</strong>, pas au moment de la connexion. C'est voulu : connecté et porté sont deux états très différents, et ils avaient longtemps la même apparence.`,
        it:`La pastiglia diventa verde solo <strong>a casco indossato</strong>, non al momento della connessione. È voluto: collegato e indossato sono due stati molto diversi, e a lungo si somigliavano.`,
        en:`The dot turns green only <strong>once the headband is worn</strong>, not when it connects. That is deliberate: connected and worn are two very different states, and for a long time they looked alike.`}),
    SHOT("muse-connexion.png",{fr:"La connexion Bluetooth",it:"La connessione Bluetooth",en:"The Bluetooth connection"})],
  off:[ P({fr:`Re-pressez le badge quand il est vert : le casque est déconnecté proprement. Le badge reste toujours visible — on doit pouvoir voir l'état du signal à tout moment.`,
        it:`Ripremi il badge quando è verde: il casco viene disconnesso pulitamente. Il badge resta sempre visibile — lo stato del segnale dev'essere sempre leggibile.`,
        en:`Press the badge again while green: the headset disconnects cleanly. The badge always stays visible — signal state must be readable at any time.`})],
  in:[
    P({fr:`La liaison est <strong>Bluetooth</strong> directe entre votre machine et le bandeau. L'app s'abonne aux flux EEG, PPG, accéléromètre, gyroscope et à la télémétrie (niveau de batterie).`,
        it:`Il collegamento è <strong>Bluetooth</strong> diretto tra la tua macchina e il casco. L'app si abbona ai flussi EEG, PPG, accelerometro, giroscopio e alla telemetria (livello batteria).`,
        en:`The link is direct <strong>Bluetooth</strong> between your machine and the headband. The app subscribes to the EEG, PPG, accelerometer, gyroscope and telemetry (battery level) streams.`}),
    H4({fr:"Si le lien tombe",it:"Se il collegamento cade",en:"If the link drops"}),
    P({fr:`L'app tente une <strong>reconnexion silencieuse</strong> : jusqu'à 6 essais espacés de 5 s (30 s en tout), sans toucher à la séance ni aux données déjà accumulées. Pendant ce temps le badge affiche « connexion » — il ne prétend jamais être connecté alors qu'il ne l'est pas. Si le casque n'émet plus (éteint, endormi), l'app abandonne <strong>proprement</strong> : rallumez le bandeau et re-pressez CONNECTER.`,
        it:`L'app tenta una <strong>riconnessione silenziosa</strong>: fino a 6 tentativi ogni 5 s (30 s in tutto), senza toccare la seduta né i dati già raccolti. Nel frattempo il badge mostra « connessione » — non finge mai di essere connesso. Se il casco non trasmette più (spento, addormentato), l'app si arrende <strong>pulitamente</strong>: riaccendi il casco e ripremi CONNETTI.`,
        en:`The app attempts a <strong>silent reconnect</strong>: up to 6 tries 5 s apart (30 s total), without touching the session or the data already gathered. Meanwhile the badge reads "connecting" — it never pretends to be connected when it isn't. If the headset stopped broadcasting (off, asleep), the app gives up <strong>cleanly</strong>: power it back on and press CONNECT again.`}),
    NOTE("warn",UI.L_warn,{fr:`Connecté <strong>ne suffit pas</strong> : le casque doit être porté. Posé sur la table, les électrodes flottent et produiraient une charge fantôme — l'app bloque donc tout tant qu'il n'y a pas de contact réel.`,
        it:`Connesso <strong>non basta</strong>: il casco dev'essere indossato. Appoggiato sul tavolo gli elettrodi flottano e produrrebbero carica fantasma — l'app quindi blocca tutto finché non c'è contatto reale.`,
        en:`Connected is <strong>not enough</strong>: the headset must be worn. On the table the electrodes float and would produce phantom charge — so the app blocks everything until there is real contact.`})]},

/* ───────────────────────── THETA-METER (boîtes) ───────────────────────── */
{ id:"m-theta", grp:"core", t:{fr:"THETA-METER — l'e-mètre réel (USB)",it:"THETA-METER — l'e-meter vero (USB)",en:"THETA-METER — the real e-meter (USB)"},
  role:[
    P({fr:`Un <strong>vrai e-mètre</strong> branché en USB : les <strong>boîtes</strong> (cans) tenues dans les mains mesurent la <strong>résistance cutanée réelle</strong>. Là où le MUSE reconstruit un Tone Arm depuis l'EEG, ici le TA est une <strong>résistance mesurée</strong> — des ohms, pas une reconstruction. Les deux peuvent tourner ensemble : deux aiguilles sur le même cadran.`,
        it:`Un <strong>e-meter vero</strong> collegato in USB: le <strong>boîtes</strong> (lattine) tenute in mano misurano la <strong>resistenza cutanea reale</strong>. Dove il MUSE ricostruisce un Tone Arm dall'EEG, qui il TA è una <strong>resistenza misurata</strong> — ohm, non una ricostruzione. I due possono girare insieme: <strong>con tutti e due collegati si guarda l'ago del METER</strong> (misurato, non ricostruito) e si leggono <strong>le due indicazioni di reazione</strong>, etichettate METER e MUSE. La scelta resta tua e il selettore non te la disfa più: prima bastava armare un ciclo perché l'ago tornasse al MUSE da solo.`,
        en:`A <strong>real e-meter</strong> on USB: the <strong>cans</strong> held in the hands measure <strong>actual skin resistance</strong>. Where the MUSE reconstructs a Tone Arm from the EEG, here the TA is a <strong>measured resistance</strong> — ohms, not a reconstruction. Both can run together: two needles on the same dial.`}),
    SHOT("theta-cadran.png",{fr:"Les deux aiguilles : MUSE et boîtes",it:"I due aghi: MUSE e boîtes",en:"The two needles: MUSE and cans"})],
  on:[
    P({fr:`Branchez l'appareil en <strong>USB</strong>, puis pressez <span class="tag">METER</span> (en haut à gauche, ou dans le panneau BRANCHER UN INSTRUMENT). La fenêtre de choix du périphérique s'ouvre : prenez le <strong>THETA-METER</strong>. Vous n'avez <strong>pas</strong> besoin de lancer le logiciel Theta-Meter — mais si vous le lancez, les deux peuvent lire l'appareil <strong>en même temps</strong>, ce qui est pratique pour comparer.`,
        it:`Collega l'apparecchio in <strong>USB</strong>, poi premi <span class="tag">METER</span> (in alto a sinistra, o nel pannello COLLEGA UNO STRUMENTO). Si apre la finestra di scelta del dispositivo: prendi il <strong>THETA-METER</strong>. Non serve lanciare il programma Theta-Meter — ma se lo lanci, i due possono leggere l'apparecchio <strong>allo stesso tempo</strong>, comodo per confrontare.`,
        en:`Plug the device into <strong>USB</strong>, then press <span class="tag">METER</span> (top left, or in the CONNECT AN INSTRUMENT panel). The device-picker opens: choose the <strong>THETA-METER</strong>. You do <strong>not</strong> need to launch the Theta-Meter software — but if you do, both can read the device <strong>at the same time</strong>, which is handy for comparing.`}),
    NOTE("ok",UI.L_ok,{fr:`Le badge indique aussi <strong>quel</strong> appareil a été pris (nom · identifiants) et le compte des lectures reçues. « Connecté » et « reçoit des données » sont deux choses différentes : sur une machine qui n'est pas la vôtre, c'est ce qui rend un « ça ne marche pas » diagnosticable.`,
        it:`Il badge indica anche <strong>quale</strong> apparecchio è stato preso (nome · identificativi) e il conteggio delle letture ricevute. « Connesso » e « riceve dati » sono due cose diverse: su una macchina che non è la tua, è questo che rende diagnosticabile un « non funziona ».`,
        en:`The badge also shows <strong>which</strong> device was taken (name · ids) and the count of readings received. "Connected" and "receiving data" are two different things: on someone else's machine, this is what makes a "it doesn't work" diagnosable.`})],
  off:[ P({fr:`Re-pressez <span class="tag">METER</span> : l'appareil est relâché et le badge s'éteint. Un clic par erreur se défait donc du même geste.`,
        it:`Ripremi <span class="tag">METER</span>: l'apparecchio viene rilasciato e il badge si spegne. Un clic per errore si disfa dunque con lo stesso gesto.`,
        en:`Press <span class="tag">METER</span> again: the device is released and the badge goes out. A misclick is undone by the same gesture.`})],
  in:[
    H4({fr:"Ce que vous lisez à l'écran",it:"Cosa leggi sullo schermo",en:"What you read on screen"}),
    TABLE({fr:["Ce que vous voyez","Ce que ça veut dire"],it:["Cosa vedi","Cosa vuol dire"],en:["What you see","What it means"]},[
      {fr:["L'aiguille ambre","La résistance de l'instant — elle réagit à ce que vous dites."],
       it:["L'ago ambra","La resistenza dell'istante — reagisce a quello che dici."],
       en:["The amber needle","The instant resistance — it reacts to what you say."]},
      {fr:["Le <strong>TA</strong> en haut","La position du bras. Il bouge lentement : c'est le niveau de fond, pas la réaction."],
       it:["Il <strong>TA</strong> in alto","La posizione del braccio. Si muove piano: è il livello di fondo, non la reazione."],
       en:["The <strong>TA</strong> at the top","The arm's position. It moves slowly: the background level, not the read."]},
      {fr:["<strong>Total TA</strong>","Le mouvement accumulé depuis le début — la mesure du travail fait."],
       it:["<strong>Total TA</strong>","Il movimento accumulato dall'inizio — la misura del lavoro fatto."],
       en:["<strong>Total TA</strong>","Movement accumulated since the start — the measure of work done."]},
      {fr:["La réaction écrite en <strong style='color:#f59e0b'>ambre</strong>","Elle vient des boîtes (celle du MUSE s'écrit en blanc)."],
       it:["La reazione scritta in <strong style='color:#f59e0b'>ambra</strong>","Viene dalle boîtes (quella del MUSE si scrive in bianco)."],
       en:["The read written in <strong style='color:#f59e0b'>amber</strong>","It comes from the cans (the MUSE's is written in white)."]}]),
    NOTE("note",UI.L_note,{fr:`La réaction s'écrit <strong>pendant</strong> que l'aiguille tombe, et se corrige si elle continue de tomber : une SF peut devenir FALL, puis LONG FALL. C'est la lecture en direct, comme sur le cadran.`,
        it:`La reazione si scrive <strong>mentre</strong> l'ago cade, e si corregge se continua a scendere: una SF può diventare FALL, poi LONG FALL. È la lettura in diretta, come sul quadrante.`,
        en:`The read is written <strong>while</strong> the needle falls, and updates if it keeps falling: an SF can become FALL, then LONG FALL. This is live reading, as on the dial.`}),
    H4({fr:"Avant chaque séance : les deux tests",it:"Prima di ogni seduta: i due test",en:"Before every session: the two tests"}),
    P({fr:`Ils se refont <strong>à chaque fois</strong>, et pour chaque préclear — ils dépendent de ses mains, de sa façon de tenir les boîtes, de la saison. Ce n'est pas une formalité : sans eux l'aiguille est trop molle ou trop nerveuse, et les lectures ne veulent rien dire.`,
        it:`Si rifanno <strong>ogni volta</strong>, e per ogni preclear — dipendono dalle sue mani, da come tiene le boîtes, dalla stagione. Non è una formalità: senza, l'ago è troppo molle o troppo nervoso, e le letture non vogliono dire niente.`,
        en:`Redo them <strong>every time</strong>, for each preclear — they depend on their hands, how they hold the cans, the season. Not a formality: without them the needle is too soft or too jumpy, and the reads mean nothing.`}),
    UL({fr:[`<strong>Pression</strong> — le préclear serre <em>légèrement</em>. L'aiguille doit descendre jusqu'au <strong>repère</strong> tracé sur le cadran. Trop court ou trop loin → réglez avec <strong>±</strong> et refaites.`,
            `<strong>Souffle</strong> — une inspiration profonde. L'aiguille doit tomber d'<strong>au moins un tiers</strong>. Le verdict est écrit : CORRESPOND / NE CORRESPOND PAS.`],
        it:[`<strong>Stretta</strong> — il preclear stringe <em>leggermente</em>. L'ago deve scendere fino al <strong>repère</strong> segnato sul quadrante. Troppo poco o troppo → regola con <strong>±</strong> e rifai.`,
            `<strong>Soffio</strong> — un respiro profondo. L'ago deve cadere di <strong>almeno un terzo</strong>. Il verdetto è scritto: CORRISPONDE / NON CORRISPONDE.`],
        en:[`<strong>Squeeze</strong> — the preclear squeezes <em>gently</em>. The needle must fall to the <strong>mark</strong> on the dial. Too short or too far → adjust with <strong>±</strong> and redo.`,
            `<strong>Breath</strong> — one deep breath. The needle must fall <strong>at least a third</strong>. The verdict is spelled out: MATCHES / DOES NOT MATCH.`]}),
    H4({fr:"Correspondances TA ↔ échelle des tons",it:"Corrispondenze TA ↔ scala del tono",en:"TA ↔ tone scale correspondences"}),
    P({fr:`<strong>Le ton 40 est la LECTURE DE CLAIR</strong> — TA 3,0 pour l'homme, 2,0 pour la femme — et non le TA zéro : la résistance d'un corps ne descend jamais à zéro, donc y accrocher le ton 40 le rendait inatteignable par construction. Le bas de l'échelle du mètre (TA 6,5) reste le −40.<br>Conversion : <strong>ton = 40 − 80 × (TA − TA<sub>clair</sub>) ÷ (6,5 − TA<sub>clair</sub>)</strong>. Une division de TA vaut donc <strong>22,9</strong> divisions de ton chez l'homme et <strong>17,8</strong> chez la femme.`,
        it:`<strong>Il tono 40 è la LETTURA DI CLEAR</strong> — TA 3,0 per l'uomo, 2,0 per la donna — e non il TA zero: la resistenza di un corpo non scende mai a zero, quindi ancorarci il tono 40 lo rendeva irraggiungibile per costruzione. Il fondo scala del meter (TA 6,5) resta il −40.<br>Conversione: <strong>tono = 40 − 80 × (TA − TA<sub>clear</sub>) ÷ (6,5 − TA<sub>clear</sub>)</strong>. Una divisione di TA vale quindi <strong>22,9</strong> divisioni di tono nell'uomo e <strong>17,8</strong> nella donna.`,
        en:`<strong>Tone 40 is the CLEAR READ</strong> — TA 3.0 for a man, 2.0 for a woman — not TA zero: a body's resistance never falls to zero, so anchoring tone 40 there made it unreachable by construction. The meter's bottom (TA 6.5) stays the −40.<br>Conversion: <strong>tone = 40 − 80 × (TA − TA<sub>clear</sub>) ÷ (6.5 − TA<sub>clear</sub>)</strong>. One TA division is therefore worth <strong>22.9</strong> tone divisions for a man and <strong>17.8</strong> for a woman.`}),
    TABLE({fr:['TON','TA homme','TA femme','NIVEAU'],it:['TONO','TA uomo','TA donna','LIVELLO'],en:['TONE','TA man','TA woman','LEVEL']}, [
      ['+40', '3,00', '2,00', 'Serenity of Beingness'],
      ['+30', '3,44', '2,56', 'Postulates'],
      ['+20', '3,88', '3,13', 'Action'],
      ['+9', '4,36', '3,74', 'Sympathy'],
      ['+6', '4,49', '3,91', 'Aesthetic'],
      ['+4', '4,58', '4,03', 'Enthusiasm'],
      ['+3', '4,62', '4,08', 'Conservatism'],
      ['+2', '4,66', '4,14', 'Antagonism'],
      ['0', '4,75', '4,25', 'Body Death'],
      ['-10', '5,19', '4,81', 'Being Objects'],
      ['-20', '5,63', '5,38', 'Being Nothing'],
      ['-30', '6,06', '5,94', 'Can&#39;t Hide'],
